<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL BREACH</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; }
        #vContainer { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; color: #ff0000; z-index: 10; }
        h1 { font-size: 24px; border: 2px solid #ff0000; padding: 10px; animation: flash 0.5s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.1; } 100% { opacity: 1; } }
        .info { width: 80%; color: #00ffff; font-size: 13px; text-align: left; margin: 20px 0; border-left: 2px solid #00ffff; padding-left: 10px; }
        #timer { font-size: 80px; font-weight: bold; margin-top: 20px; text-shadow: 0 0 20px red; }
        #scaryImg { width: 100vw; height: 100vh; object-fit: cover; position: fixed; top: 0; left: 0; z-index: 100; display: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: none; }
    </style>
</head>
<body onclick="startAttack()">
    <div id="vContainer">
        <h1>CRITICAL SYSTEM BREACH</h1>
        <div class="info">
            > CONNECTION: ESTABLISHED<br>
            > NODE: D33P_W3B_ENCRYPTOR<br>
            > STATUS: UPLOADING PRIVATE_DATA...<br>
            > WARNING: DO NOT EXIT OR DEVICE WILL BRICK.
        </div>
        <div style="color:white; font-size: 12px;">DESTRUCTION IN:</div>
        <div id="timer">01:00</div>
    </div>

    <img id="scaryImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    <audio id="snd" src="https://www.soundboard.com/handler/DownloadTrack.ashx?cliptitle=Scary+Scream&filename=24/243645-77983652-326d-476b-9c71-29402513f56b.mp3"></audio>

    <script>
        let time = 60;
        let active = false;

        function startAttack() {
            if (active) return;
            active = true;
            
            // طلب ملء الشاشة لإخفاء شريط قوقل (المهمة رقم 3)
            document.documentElement.requestFullscreen();

            let count = setInterval(() => {
                time--;
                let s = time % 60;
                document.getElementById('timer').innerHTML = `00:${s < 10 ? '0' : ''}${s}`;
                
                if (time <= 0) {
                    clearInterval(count);
                    // تجميد المتصفح تماماً (المهمة رقم 2)
                    document.getElementById('vContainer').style.display = 'none';
                    document.getElementById('scaryImg').style.display = 'block';
                    document.getElementById('overlay').style.display = 'block';
                    document.getElementById('snd').play();
                    
                    while(true) { alert("FATAL ERROR: DEVICE COMPROMISED"); }
                }
            }, 1000);
        }
    </script>
    <div id="overlay"></div>
</body>
</html>
