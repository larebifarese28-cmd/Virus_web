<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNAUTHORIZED ACCESS DETECTED</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; color: #ff0000; }
        
        /* واجهة التحذير الأولى (إنجليزية فقط - Deep Web Style) */
        #mainContainer { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; z-index: 10; background: radial-gradient(circle, #1a0000 0%, #000 100%); transition: opacity 0.3s ease; }
        
        h1 { font-size: 28px; text-transform: uppercase; letter-spacing: 2px; border: 2px solid #ff0000; padding: 10px; margin-bottom: 30px; animation: glitchText 1s infinite; }
        
        @keyframes glitchText { 0% { text-shadow: 1px 1px red; } 50% { text-shadow: -1px -1px blue; } 100% { text-shadow: 1px -1px red; } }
        
        .message-box { width: 85%; line-height: 1.5; color: #00ffff; font-size: 14px; border-left: 3px solid #00ffff; padding-left: 10px; text-align: left; }
        
        /* العد التنازلي */
        #timer { font-size: 60px; font-weight: bold; color: #ff0000; text-shadow: 0 0 20px #ff0000; margin-top: 20px; animation: zoomTimer 1s ease-in-out; }
        @keyframes zoomTimer { from { transform: scale(1.5); } to { transform: scale(1); } }
        
        /* الصورة المرعبة (مخفية في البداية سواسوة) */
        #scaryImgContainer { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 100; display: none; background-color: #000; }
        #scaryImg { width: 100vw; height: 100vh; object-fit: cover; }
        
        /* تأثيرات الرعب الإضافية */
        .scary-flash { animation: flashScreen 0.1s infinite; }
        @keyframes flashScreen { 0%, 100% { background-color: #000; } 50% { background-color: #fff; } }
        
        /* طبقة وهمية لإخفاء المتصفح */
        #fakeBrowserLayer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: rgba(0,0,0,0); }
    </style>
</head>
<body onclick="megaVirus()">
    <div id="mainContainer">
        <h1>UNAUTHORIZED ACCESS DETECTED</h1>
        
        <div class="message-box">
            [SYSTEM ERROR]: UNKNOWN MALWARE IDENTIFIED. <br>
            [STATUS]: ALL FILES ARE BEING ENCRYPTED AND SENT TO DARK NET NODES. <br>
            [NOTICE]: DO NOT CLOSE THIS WINDOW OR YOUR DEVICE WILL BE PERMANENTLY BRICKED.
        </div>

        <p style="color:white; text-transform: uppercase;">TERMINATION IN:</p>
        <div id="timer">01:00</div>
    </div>

    <div id="scaryImgContainer">
        <img id="scaryImg" src="https://i.ibb.co/39snnynW/1000016067.jpg" alt="SCARY_FACE">
    </div>

    <audio id="screamSound" src="https://www.soundboard.com/handler/DownloadTrack.ashx?cliptitle=Scary+Scream&filename=24/243645-77983652-326d-476b-9c71-29402513f56b.mp3"></audio>

    <script>
        let timeLeft = 60; // 1 دقيقة
        let started = false;

        function megaVirus() {
            if (started) return;
            started = true;
            
            // 1. ميزة ملء الشاشة الأوتوماتيكية لإخفاء المتصفح تماماً (المهمة رقم 3)
            document.documentElement.requestFullscreen().catch(err => {
                alert("SYSTEM BREACH: Grant full access to finalize encryption!");
            });

            // اهتزاز خفيف للهاتف
            if (navigator.vibrate) navigator.vibrate([200]);

            // 2. تفعيل العداد التنازلي الأوتوماتيكي (المهمة رقم 1)
            let countdown = setInterval(() => {
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById('timer').innerHTML = `0${mins}:${secs < 10 ? '0' : ''}${secs}`;
                
                // في آخر 10 ثوانٍ، يبدأ الرعب يزداد
                if (timeLeft <= 10) {
                    document.getElementById('timer').style.color = '#fff';
                    if (navigator.vibrate) navigator.vibrate([500]);
                }
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    
                    // إخفاء المتصفح للأبد عن طريق حظر اللمس
                    document.body.innerHTML += '<div id="fakeBrowserLayer"></div>';
                    
                    // 3. الصدمة النهائية بالصوت والصورة سواسوة (المهمة رقم 2)
                    document.getElementById('mainContainer').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('mainContainer').style.display = 'none';
                        let imgContainer = document.getElementById('scaryImgContainer');
                        imgContainer.style.display = 'block';
                        
                        let scream = document.getElementById('screamSound');
                        scream.volume = 1.0; // أعلى صوت ممكن صاخب
                        scream.play();
                        
                        // تأثير تجميد إضافي (لاق لا يتوقف) للأرعاب
                        while(true) {
                            alert("SYSTEM TERMINATED. FILES DELETED.");
                        }
                    }, 300);
                }
            }, 1000);
        }
    </script>
</body>
</html>
