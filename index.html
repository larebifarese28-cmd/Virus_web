<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_OVERRIDE</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; }
        
        /* الصورة المرعبة اللي عطيتهالي (دمج مباشر) */
        #scaryImg { 
            width: 100vw; height: 100vh; 
            object-fit: cover; 
            position: fixed; top: 0; left: 0; 
            z-index: 100; display: none; 
        }
        
        #ui { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #ff0000; text-align: center; }
        
        /* واجهة الـ Deep Web الجديدة */
        .glitch-border { border: 3px solid #ff0000; padding: 20px; background: rgba(20,0,0,0.9); box-shadow: 0 0 20px red; }
        h1 { font-size: 22px; letter-spacing: 3px; animation: flash 0.2s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        #timer { font-size: 90px; font-weight: bold; margin: 15px 0; color: #fff; text-shadow: 0 0 30px red; }
        .console { width: 85%; color: #00ffff; font-size: 12px; text-align: left; border-left: 3px solid #00ffff; padding-left: 10px; margin-top: 10px; }
    </style>
</head>
<body onclick="startBreach()">

    <div id="ui">
        <div class="glitch-border">
            <h1>FATAL SYSTEM BREACH</h1>
            <div class="console">
                > TARGET_LOCATED: FOUKA_NODE<br>
                > BYPASSING_FIREWALL... DONE<br>
                > UPLOADING_ENCRYPTED_FILES... 88%<br>
                > WARNING: DEVICE_TERMINATION_IN:
            </div>
            <div id="timer">01:00</div>
            <p style="color:white; font-size: 10px; letter-spacing: 5px;">Ʉ₦ⱧØⱠɎ Ø฿₴ɆⱤV₳₮łØ₦</p>
        </div>
    </div>

    <img id="scaryImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    
    <audio id="scream" src="https://www.soundboard.com/handler/DownloadTrack.ashx?cliptitle=Scary+Scream&filename=24/243645-77983652-326d-476b-9c71-29402513f56b.mp3"></audio>

    <script>
        let timeLeft = 60;
        let isStarted = false;

        function startBreach() {
            if (isStarted) return;
            isStarted = true;
            
            // ميزة ملء الشاشة لإخفاء قوقل كروم (المهمة رقم 3)
            document.documentElement.requestFullscreen();

            // بدابة العد التنازلي الحقيقي (المهمة رقم 1)
            let countdown = setInterval(() => {
                timeLeft--;
                let s = timeLeft % 60;
                document.getElementById('timer').innerHTML = `00:${s < 10 ? '0' : ''}${s}`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    executeFinalShock();
                }
            }, 1000);
        }

        function executeFinalShock() {
            // إظهار الصورة المرعبة والصوت سواسوة (المهمة رقم 2)
            document.getElementById('ui').style.display = 'none';
            document.getElementById('scaryImg').style.display = 'block';
            document.getElementById('scream').play();
            
            // تجميد المتصفح نهائياً
            while(true) { alert("SYSTEM DESTROYED. GOODBYE."); }
        }
    </script>
</body>
</html>
