<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Action Planet - Final</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; background: #ffffff; }
        .btn-action { background: #ffcc00; color: #000; border: 5px solid #000; padding: 25px 70px; font-size: 28px; font-weight: bold; border-radius: 60px; cursor: pointer; }
        
        /* صورة المرأة المرعبة سواسوة */
        #madImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 999; display: none; }

        /* أنيميشن الرعب سواسوة */
        @keyframes creep {
            0% { transform: scale(1); filter: grayscale(1); }
            50% { transform: scale(1.3) translate(10px, -10px); filter: grayscale(0) contrast(2); }
            100% { transform: scale(1.1) translate(-10px, 10px); }
        }
        .vibrate { display: block !important; animation: creep 0.05s infinite alternate; }
    </style>
</head>
<body>
    <div id="ui">
        <button class="btn-action" onclick="startChaos()">دخول</button>
    </div>

    <img id="madImg" src="https://i.postimg.cc/9f09z77X/horror-lady.jpg">

    <script>
        function startChaos() {
            document.getElementById('ui').style.display = 'none';
            document.getElementById('madImg').classList.add('vibrate');

            // الروابط المباشرة (Direct Links) سواسوة
            const sounds = [
                "https://www.myinstants.com/media/sounds/twahwih-94526.mp3",
                "https://www.myinstants.com/media/sounds/w-rbk-shwl-hd-64729.mp3",
                "https://www.myinstants.com/media/sounds/m-e-o-w-82698.mp3"
            ];

            sounds.forEach(src => {
                let a = new Audio(src);
                a.loop = true;
                a.play().catch(() => {
                    // إذا منع المتصفح الصوت، ننتظر أول لمسة سواسوة
                    document.addEventListener('click', () => a.play(), {once: true});
                });
            });

            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        }
    </script>
</body>
</html>
