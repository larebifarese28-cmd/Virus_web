<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM_CRITICAL_ERROR</title>
    <link rel="preload" as="image" href="https://i.ibb.co/39snnynW/1000016067.jpg">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; }
        
        /* واجهة الهاكر الاحترافية */
        #mainUI { position: relative; z-index: 10; height: 100vh; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; border: 4px solid #300; box-sizing: border-box; background: radial-gradient(circle, #100 0%, #000 100%); }
        .danger-text { color: #ff0000; text-align: center; text-shadow: 0 0 15px red; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        #timer { font-size: 100px; font-weight: bold; color: #fff; text-align: center; text-shadow: 0 0 20px #ff0000; }
        
        .status-box { color: #00ffff; font-size: 14px; background: rgba(0, 255, 255, 0.05); padding: 15px; border-left: 3px solid #00ffff; }
        .warning-msg { color: #ff0000; font-weight: bold; margin-top: 10px; }

        /* الصورة المرعبة اللي طلبتها */
        #finalPayload { width: 100vw; height: 100vh; object-fit: cover; position: fixed; top: 0; left: 0; z-index: 1000; display: none; }
    </style>
</head>
<body onclick="activateSystem()">

    <div id="mainUI">
        <div class="danger-text">
            <h1>⚠️ UNAUTHORIZED ACCESS DETECTED ⚠️</h1>
        </div>

        <div id="timer">01:00</div>

        <div class="status-box">
            > KERNEL_WIPEOUT: INITIATED...<br>
            > DATA_STREAM: ENCRYPTED_AND_SENT_TO_NODE_77<br>
            > STATUS: <span style="color:red">PERMANENT_BRICKING_STARTED</span>
            <div class="warning-msg">DO NOT ATTEMPT TO REBOOT - ALL BIOS DATA IS BEING PURGED.</div>
        </div>
    </div>

    <img id="finalPayload" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    
    <audio id="horrorAudio" src="https://www.soundboard.com/handler/DownloadTrack.ashx?cliptitle=Scary+Scream&filename=24/243645-77983652-326d-476b-9c71-29402513f56b.mp3"></audio>

    <script>
        let countdown = 60;
        let isStarted = false;

        function activateSystem() {
            if (isStarted) return;
            isStarted = true;

            // تفعيل ملء الشاشة لإخفاء كل شيء (المهمة رقم 3)
            document.documentElement.requestFullscreen();

            // بدء العداد التنازلي الحقيقي
            let timerInterval = setInterval(() => {
                countdown--;
                let s = countdown % 60;
                document.getElementById('timer').innerText = `00:${s < 10 ? '0' : ''}${s}`;
                
                if (countdown <= 0) {
                    clearInterval(timerInterval);
                    launchTerror();
                }
            }, 1000);
        }

        function launchTerror() {
            // إظهار الصورة سواسوة مع انتهاء الوقت
            document.getElementById('mainUI').style.display = 'none';
            document.getElementById('finalPayload').style.display = 'block';
            document.getElementById('horrorAudio').play();
            
            // قفل المتصفح لزيادة "الخلعة"
            while(true) { alert("SYSTEM FAILURE: YOUR DATA HAS BEEN DELETED."); }
        }
    </script>
</body>
</html>
