<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Action Planet</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; overflow: hidden; }
        #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; background: #ffffff; }
        .btn-action { background: #ffcc00; color: #000; border: 4px solid #000; padding: 20px 60px; font-size: 24px; font-weight: bold; border-radius: 50px; cursor: pointer; }
        #madImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 999; display: none; }
        @keyframes touhouh {
            0% { transform: scale(1.1); }
            10% { transform: translate(-20px, -20px) scale(1.3); }
            50% { transform: translate(20px, 20px) scale(1.4); }
            100% { transform: scale(1.1); }
        }
        .vibrate { display: block !important; animation: touhouh 0.01s infinite linear; }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-size: 24px; margin-bottom: 20px;">كوكب أكشن يرحب بكم</div>
        <button class="btn-action" onclick="startVirus()">دخول</button>
    </div>
    <img id="madImg" src="https://i.ibb.co/Rw1PbVp/1000017054.jpg">

    <script>
        function startVirus() {
            // إخفاء الواجهة وإظهار التوحويح
            document.getElementById('ui').style.display = 'none';
            document.getElementById('madImg').classList.add('vibrate');

            // قائمة الأصوات الستة سواسوة
            const sounds = [
                "https://www.myinstants.com/media/sounds/hoova-2.mp3",
                "https://www.myinstants.com/media/sounds/chicken-on-tree-screaming.mp3",
                "https://www.myinstants.com/media/sounds/dzonza.mp3",
                "https://www.myinstants.com/media/sounds/nikomok-55306.mp3",
                "https://www.myinstants.com/media/sounds/aaaaaaaaaaaaaaaaaaaa-e-lutador-57357.mp3",
                "https://www.myinstants.com/media/sounds/nykwny-35320.mp3"
            ];

            // فرض تشغيل كل صوت سواسوة
            sounds.forEach(src => {
                let audio = new Audio(src);
                audio.loop = true;
                // المحاولة المتكررة للتشغيل سواسوة لتجاوز الحظر
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        // إذا رفض المتصفح، نعيد المحاولة عند أي لمسة
                        document.body.addEventListener('click', () => audio.play(), {once: true});
                    });
                }
            });

            // ملء الشاشة سواسوة
            document.documentElement.requestFullscreen().catch(()=>{});
        }
    </script>
</body>
</html>
