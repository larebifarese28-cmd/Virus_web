<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Action Planet</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; overflow: hidden; }
        #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; background: #ffffff; }
        .btn-action { background: #ffcc00; color: #000; border: 4px solid #000; padding: 20px 60px; font-size: 24px; font-weight: bold; border-radius: 50px; cursor: pointer; }
        #madImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 999; display: none; }
        @keyframes touhouh {
            0% { transform: scale(1.1); }
            5% { transform: translate(-25px, -15px) scale(1.3); }
            15% { transform: translate(25px, 25px) scale(1.4); }
            100% { transform: scale(1.1); }
        }
        .vibrate { display: block !important; animation: touhouh 0.01s infinite linear; }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-size: 26px; font-weight: bold; margin-bottom: 25px;">مرحباً بك في كوكب أكشن</div>
        <button class="btn-action" onclick="activateChaos()">دخول</button>
    </div>
    <img id="madImg" src="https://i.ibb.co/Rw1PbVp/1000017054.jpg">

    <script>
        function activateChaos() {
            document.getElementById('ui').style.display = 'none';
            document.getElementById('madImg').classList.add('vibrate');

            // الأصوات الجديدة الموزونة سواسوة (مع صوت آه آه)
            const sounds = [
                "https://www.myinstants.com/media/sounds/moan-sound-effect-short.mp3", // صوت آه آه الموزون
                "https://www.myinstants.com/media/sounds/hoova-2.mp3",
                "https://www.myinstants.com/media/sounds/scary-female-scream-sound-effect.mp3", // صرخة حادة
                "https://www.myinstants.com/media/sounds/laughing-joker.mp3", // ضحكة هستيرية
                "https://www.myinstants.com/media/sounds/troll-face-laugh-sound-effect.mp3",
                "https://www.myinstants.com/media/sounds/evil-laugh-sound-effect.mp3"
            ];

            sounds.forEach(src => {
                let a = new Audio(src);
                a.loop = true;
                // نعدلو الفوليم لكل صوت باش يخرجوا قاع كيف كيف سواسوة
                a.volume = 1.0; 
                
                const start = () => { a.play().catch(() => setTimeout(start, 100)); };
                start();
            });

            document.documentElement.requestFullscreen().catch(()=>{});
        }
    </script>
</body>
</html>
