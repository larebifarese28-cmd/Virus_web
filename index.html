<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEEP WEB OVERRIDE</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; }
        #scaryImg { width: 100vw; height: 100vh; object-fit: cover; position: fixed; top: 0; left: 0; z-index: -1; filter: grayscale(100%) contrast(150%); }
        #ui { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #0f0; text-align: center; background: rgba(0,0,0,0.7); z-index: 1; border: 5px solid red; box-sizing: border-box; }
        #timer { font-size: 80px; color: red; text-shadow: 0 0 20px #f00; font-weight: bold; }
        .msg { font-size: 14px; margin: 10px; color: #fff; background: red; padding: 5px; }
    </style>
</head>
<body onclick="megaVirus()">
    <img id="scaryImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">
    <div id="ui">
        <h1 style="color:red; background:white; width:100%;">⚠️ WARNING: SYSTEM TERMINATION ⚠️</h1>
        <p>Your IP has been logged by [D33P_W3B_NODES]. Destruction in:</p>
        <div id="timer">02:00</div>
        <div id="status" class="msg">INITIALIZING DATA PURGE...</div>
        <p style="color:yellow; direction: rtl; font-weight: bold;">ربي يسهل عليك، حنّا مقلنالكش أدخل. <br>Your files are being uploaded to the dark net.</p>
    </div>

    <script>
        let t = 120; 
        function megaVirus() {
            // 1. ملء الشاشة والاهتزاز (لزيادة الرعب)
            document.documentElement.requestFullscreen();
            if (navigator.vibrate) navigator.vibrate([1000, 500, 1000]);

            // 2. العداد التنازلي المرعب
            setInterval(() => {
                let m = Math.floor(t/60), s = t%60;
                document.getElementById('timer').innerHTML = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
                if(t>0) t--;
            }, 1000);

            // 3. رسائل النظام الوهمية
            const msgs = ["CLEANING STORAGE...", "UPLOADING CONTACTS...", "ENCRYPTING GALLERY...", "HACKING CAMERA..."];
            setInterval(() => {
                document.getElementById('status').innerHTML = msgs[Math.floor(Math.random()*msgs.length)];
            }, 2000);

            // 4. اللاق الأسطوري (تجميد المتصفح)
            setInterval(() => {
                alert("CRITICAL ERROR: D33P_W3B_ENCRYPTION_FAILED");
                alert("PERMISSION DENIED: CANNOT STOP PROCESS");
            }, 50);
        }
    </script>
</body>
</html>
